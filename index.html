<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1d33">
<title>ベルーガの世界大冒険</title>
<style>
  html,body{margin:0;height:100%;background:#0b1d33;overflow:hidden;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none;
    font-family:"Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",sans-serif}
  *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  #wrap{position:fixed;inset:0}
  #c{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#000;touch-action:none}

  /* ---- スマホ用コントローラ ---- */
  #touchUI{display:none;position:fixed;inset:0;pointer-events:none;z-index:5}
  body.touch #touchUI{display:block}
  #dpad{position:absolute;left:max(14px,env(safe-area-inset-left));bottom:max(10px,env(safe-area-inset-bottom));
    width:min(42vh,200px);height:min(42vh,200px);pointer-events:auto;touch-action:none}
  #dpad .arm{position:absolute;background:rgba(255,255,255,.26);border:2px solid rgba(255,255,255,.55);box-sizing:border-box}
  #dpad .h{left:0;top:33.3%;width:100%;height:33.4%;border-radius:14px}
  #dpad .v{top:0;left:33.3%;height:100%;width:33.4%;border-radius:14px}
  #dpad .cover{position:absolute;left:33.3%;top:33.3%;width:33.4%;height:33.4%;background:rgba(255,255,255,.26);border-radius:6px}
  #dpad i{position:absolute;width:0;height:0;border:solid transparent;opacity:.75;transition:opacity .05s}
  #dpad i.on{opacity:1;filter:drop-shadow(0 0 4px #fff)}
  #dpad .tu{left:50%;top:9%;margin-left:-9px;border-width:0 9px 15px 9px;border-bottom-color:#fff}
  #dpad .td{left:50%;bottom:9%;margin-left:-9px;border-width:15px 9px 0 9px;border-top-color:#fff}
  #dpad .tl{top:50%;left:9%;margin-top:-9px;border-width:9px 15px 9px 0;border-right-color:#fff}
  #dpad .tr{top:50%;right:9%;margin-top:-9px;border-width:9px 0 9px 15px;border-left-color:#fff}
  .abtn{position:absolute;border-radius:50%;pointer-events:auto;touch-action:none;
    background:rgba(255,255,255,.26);border:2px solid rgba(255,255,255,.6);color:rgba(255,255,255,.95);
    display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;
    width:min(24vh,112px);height:min(24vh,112px);font-size:min(9vh,40px);line-height:1;text-shadow:0 1px 3px rgba(0,0,0,.5)}
  .abtn small{font-size:min(3.4vh,14px);font-weight:700;margin-top:2px}
  .abtn.on{background:rgba(255,255,255,.55)}
  #btnA{right:max(14px,env(safe-area-inset-right));bottom:calc(max(10px,env(safe-area-inset-bottom)) + min(14vh,70px))}
  #btnB{right:calc(max(14px,env(safe-area-inset-right)) + min(27vh,130px));bottom:max(10px,env(safe-area-inset-bottom))}

  /* ---- 一時停止・音 ---- */
  .sys{position:fixed;top:max(8px,env(safe-area-inset-top));z-index:6;width:38px;height:38px;border-radius:50%;
    background:rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.55);color:#fff;font-weight:900;font-size:16px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:none}
  #btnPause{right:max(10px,env(safe-area-inset-right))}
  #btnMute{right:calc(max(10px,env(safe-area-inset-right)) + 46px)}
  #btnFull{right:calc(max(10px,env(safe-area-inset-right)) + 92px);display:none}
  body.touch #btnFull.can{display:flex}
  #btnMute.off{opacity:.5;text-decoration:line-through}

  /* ---- 縦向き警告 ---- */
  #rot{display:none;position:fixed;inset:0;z-index:20;background:#0b1d33;color:#fff;text-align:center;
    align-items:center;justify-content:center;flex-direction:column;font-size:20px;font-weight:800}
  #rot .ph{font-size:64px;animation:rot 2s ease-in-out infinite;display:inline-block}
  @keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
  @media (orientation:portrait){ body.touch #rot{display:flex} }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="640" height="360"></canvas></div>

<div id="touchUI">
  <div id="dpad">
    <div class="arm h"></div><div class="arm v"></div><div class="cover"></div>
    <i class="tu"></i><i class="td"></i><i class="tl"></i><i class="tr"></i>
  </div>
  <div class="abtn" id="btnB">B<small>あわ</small></div>
  <div class="abtn" id="btnA">A<small>ジャンプ</small></div>
</div>
<div class="sys" id="btnFull">⛶</div>
<div class="sys" id="btnMute">♪</div>
<div class="sys" id="btnPause">II</div>
<div id="rot"><div class="ph">📱</div><div style="margin-top:14px">スマホを よこむきにしてね</div></div>

<script>
'use strict';
/* =====================================================================
   ベルーガの世界大冒険  ─ 全7ステージ・横スクロールアクション
   ===================================================================== */
const W=640,H=360,TS=30,ROWS=12,GROUND=9,LW=400,TAU=Math.PI*2;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let scale=1;
function resize(){
  const ww=innerWidth,wh=innerHeight;
  let w=ww,h=ww*9/16; if(h>wh){h=wh;w=h*16/9;}
  const dpr=Math.min(window.devicePixelRatio||1,3);
  cv.style.width=w+'px';cv.style.height=h+'px';
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
  scale=cv.width/W;
}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,200));resize();

/* ---------- ユーティリティ ---------- */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const approach=(v,t,d)=>v<t?Math.min(t,v+d):Math.max(t,v-d);
function hash(n){n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n);}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const FONT='"Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",sans-serif';
function ell(x,y,rx,ry,fill,rot=0){ctx.beginPath();ctx.ellipse(x,y,Math.max(.01,rx),Math.max(.01,ry),rot,0,TAU);ctx.fillStyle=fill;ctx.fill();}
function rect(x,y,w,h,fill){ctx.fillStyle=fill;ctx.fillRect(x,y,w,h);}
function poly(p,fill){ctx.beginPath();ctx.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)ctx.lineTo(p[i],p[i+1]);ctx.closePath();ctx.fillStyle=fill;ctx.fill();}
function rrect(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);}
function txt(s,x,y,size,color,align='center',stroke,lw){
  ctx.font='800 '+size+'px '+FONT;ctx.textAlign=align;ctx.textBaseline='middle';
  if(stroke){ctx.lineJoin='round';ctx.lineWidth=lw||size*.22;ctx.strokeStyle=stroke;ctx.strokeText(s,x,y);}
  ctx.fillStyle=color;ctx.fillText(s,x,y);
}
function heartPath(x,y,s){
  ctx.beginPath();ctx.moveTo(x,y+s*.3);
  ctx.bezierCurveTo(x,y,x-s*.5,y,x-s*.5,y+s*.3);ctx.bezierCurveTo(x-s*.5,y+s*.6,x,y+s*.8,x,y+s);
  ctx.bezierCurveTo(x,y+s*.8,x+s*.5,y+s*.6,x+s*.5,y+s*.3);ctx.bezierCurveTo(x+s*.5,y,x,y,x,y+s*.3);
}
function heart(x,y,s,fill,stroke){heartPath(x,y,s);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.lineWidth=1.5;ctx.strokeStyle=stroke;ctx.stroke();}}
function starShape(x,y,r,fill,rot=0){
  ctx.beginPath();for(let i=0;i<10;i++){const a=rot-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}
  ctx.closePath();ctx.fillStyle=fill;ctx.fill();
}
function fishIcon(x,y,s,t){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  poly([-5,0,-11,-5,-11,5],'#ff9f2e');ell(0,0,7,4.8,'#ffd23f');ell(1,-1.5,4,1.6,'rgba(255,255,255,.55)');ell(3.5,-1,1.1,1.1,'#5a3a10');
  ctx.restore();
}

/* =====================================================================
   サウンド（WebAudio・素材ファイル不要）
   ===================================================================== */
const Snd={
  ctx:null,master:null,muted:false,
  init(){
    if(this.ctx)return;
    try{const AC=window.AudioContext||window.webkitAudioContext;this.ctx=new AC();
      this.master=this.ctx.createGain();this.master.gain.value=this.muted?0:.5;this.master.connect(this.ctx.destination);}catch(e){}
  },
  resume(){this.init();if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();},
  setMute(m){this.muted=m;if(this.master)this.master.gain.value=m?0:.5;
    document.getElementById('btnMute').classList.toggle('off',m);try{localStorage.setItem('belugaMute',m?'1':'0');}catch(e){}},
  tone(f,d,type='square',v=.12,to=null,delay=0){
    if(!this.ctx||this.ctx.state!=='running')return;
    const t=this.ctx.currentTime+delay,o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(this.master);o.start(t);o.stop(t+d+.02);
  },
  noise(d,v=.15,delay=0){
    if(!this.ctx||this.ctx.state!=='running')return;
    const t=this.ctx.currentTime+delay,n=Math.floor(this.ctx.sampleRate*d),b=this.ctx.createBuffer(1,n,this.ctx.sampleRate),a=b.getChannelData(0);
    for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);
    const s=this.ctx.createBufferSource(),g=this.ctx.createGain();s.buffer=b;g.gain.value=v;s.connect(g);g.connect(this.master);s.start(t);
  }
};
const mid=m=>440*Math.pow(2,(m-69)/12);
const SFX={
  jump(){Snd.tone(320,.16,'square',.09,720);},
  coin(){Snd.tone(988,.07,'square',.08);Snd.tone(1319,.14,'square',.08,null,.07);},
  stomp(){Snd.tone(260,.12,'square',.12,90);},
  hurt(){Snd.tone(360,.35,'sawtooth',.12,90);},
  bubble(){Snd.tone(500,.14,'sine',.16,1000);},
  pop(){Snd.tone(900,.06,'sine',.12,300);},
  bump(){Snd.tone(150,.08,'triangle',.2);},
  power(){[523,659,784,1047].forEach((f,i)=>Snd.tone(f,.12,'square',.08,null,i*.07));},
  up(){[659,784,1319,1047,1319,1568].forEach((f,i)=>Snd.tone(f,.1,'square',.08,null,i*.08));},
  boom(){Snd.noise(.3,.25);Snd.tone(120,.3,'sawtooth',.14,40);},
  tele(){Snd.tone(700,.1,'square',.08);Snd.tone(700,.1,'square',.08,null,.16);},
  die(){[494,440,392,330,262].forEach((f,i)=>Snd.tone(f,.2,'triangle',.16,null,i*.13));},
  clear(){[523,659,784,1047,784,1047,1319].forEach((f,i)=>Snd.tone(f,.16,'square',.09,null,i*.11));},
  select(){Snd.tone(880,.06,'square',.07);},
  ok(){Snd.tone(660,.08,'square',.08);Snd.tone(990,.12,'square',.08,null,.08);}
};
/* --- BGM: ステージごとに自動生成する簡易ループ --- */
const SONGS=[
  {root:62,sc:[0,2,4,7,9],bpm:120,seed:7},          // タイトル
  {root:60,sc:[0,2,4,7,9],bpm:136,seed:11},         // 日本
  {root:57,sc:[0,1,4,5,7,8,10],bpm:128,seed:23},    // エジプト
  {root:62,sc:[0,2,4,5,7,9,11],bpm:132,seed:31},    // フランス
  {root:64,sc:[0,2,4,7,9],bpm:144,seed:47},         // アメリカ
  {root:65,sc:[0,2,4,7,9],bpm:150,seed:59},         // ブラジル
  {root:59,sc:[0,2,4,7,9],bpm:138,seed:71},         // オーストラリア
  {root:57,sc:[0,2,3,7,8],bpm:126,seed:83}          // 南極
];
const Music={
  id:-1,step:0,next:0,mel:[],dur:.2,song:null,
  play(id){
    if(this.id===id)return;this.id=id;this.step=0;this.next=Snd.ctx?Snd.ctx.currentTime+.08:0;
    const s=this.song=SONGS[id],r=mulberry32(s.seed*97),deg=()=>s.sc[Math.floor(r()*s.sc.length)]+(r()<.35?12:0);
    const motif=()=>{const m=[];for(let i=0;i<8;i++)m.push(r()<.28?null:deg());return m;};
    const a=motif(),b=motif();this.mel=[...a,...b,...a,...motif()];this.dur=60/s.bpm/2;
  },
  stop(){this.id=-1;},
  update(){
    if(this.id<0||!Snd.ctx||Snd.ctx.state!=='running')return;
    const now=Snd.ctx.currentTime;if(this.next<now-.5)this.next=now+.05;
    while(this.next<now+.25){
      const s=this.song,st=this.step,bar=Math.floor(st/8),chord=[0,5,7,5][bar%4],dl=this.next-now;
      const m=this.mel[st];
      if(m!==null)Snd.tone(mid(s.root+12+m),this.dur*.9,'square',.035,null,dl);
      if(st%2===0)Snd.tone(mid(s.root-12+chord+(st%4===0?0:7)),this.dur*1.6,'triangle',.09,null,dl);
      if(st%4===2)Snd.noise(.04,.03,dl);
      this.step=(st+1)%32;this.next+=this.dur;
    }
  }
};

/* =====================================================================
   入力（キーボード／タッチ）
   ===================================================================== */
const inp={h:{},p:{}};
function press(n){if(!inp.h[n])inp.p[n]=true;inp.h[n]=true;}
function release(n){inp.h[n]=false;}
function clearEdges(){inp.p={};}
const KEYMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',
  Space:'a',KeyZ:'a',KeyK:'a',Enter:'a',KeyX:'b',KeyJ:'b',ShiftLeft:'b',ShiftRight:'b',Escape:'pause',KeyP:'pause'};
addEventListener('keydown',e=>{
  Snd.resume();
  if(e.code==='KeyM'){Snd.setMute(!Snd.muted);return;}
  const n=KEYMAP[e.code];if(n){e.preventDefault();if(!e.repeat){press(n);if(n==='up')press('kup');}}
});
addEventListener('keyup',e=>{const n=KEYMAP[e.code];if(n){e.preventDefault();release(n);if(n==='up')release('kup');}});
addEventListener('blur',()=>{inp.h={};});

/* スマホのタッチ操作 */
(function(){
  const body=document.body;
  const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0||/[?&]touch/.test(location.search);
  if(isTouch)body.classList.add('touch');
  addEventListener('pointerdown',e=>{if(e.pointerType==='touch')body.classList.add('touch');},{passive:true});
  const dp=document.getElementById('dpad'),ar={u:dp.querySelector('.tu'),d:dp.querySelector('.td'),l:dp.querySelector('.tl'),r:dp.querySelector('.tr')};
  const bA=document.getElementById('btnA'),bB=document.getElementById('btnB');
  /* 十字キー・A・Bの状態を「いま画面に触れている指」から毎回まとめて計算する。
     指が少しずれても押しっぱなしが途切れず、ボタン間を指でスライドもできる。 */
  let cur={left:false,right:false,up:false,down:false,a:false,b:false};
  function apply(n){
    for(const k in n){if(n[k]&&!cur[k])press(k);else if(!n[k]&&cur[k])release(k);}
    cur=n;
    ar.l.classList.toggle('on',n.left);ar.r.classList.toggle('on',n.right);ar.u.classList.toggle('on',n.up);ar.d.classList.toggle('on',n.down);
    bA.classList.toggle('on',n.a);bB.classList.toggle('on',n.b);
  }
  function inRect(el,x,y,pad){const r=el.getBoundingClientRect();return r.width>0&&x>=r.left-pad&&x<=r.right+pad&&y>=r.top-pad&&y<=r.bottom+pad;}
  function btnAt(x,y,pad){
    let best=null,bd=1e9;
    for(const[el,n]of[[bA,'a'],[bB,'b']]){if(!inRect(el,x,y,pad))continue;
      const r=el.getBoundingClientRect(),d=Math.hypot(x-(r.left+r.width/2),y-(r.top+r.height/2));if(d<bd){bd=d;best=n;}}
    return best;
  }
  function dirOf(x,y,n){
    const r=dp.getBoundingClientRect(),dx=(x-(r.left+r.width/2))/r.width,dy=(y-(r.top+r.height/2))/r.height,t=.13;
    if(dx<-t)n.left=true;if(dx>t)n.right=true;if(dy<-t)n.up=true;if(dy>t)n.down=true;
  }
  /* --- タッチ（スマホ）：ブラウザの拡大・長押し・スクロールを止めてゲームだけが受け取る --- */
  const owner=new Map(); // 指のID → 'dpad' | 'btn'
  function recompute(list){
    const n={left:false,right:false,up:false,down:false,a:false,b:false};
    for(const t of list){const k=owner.get(t.identifier);
      if(k==='dpad')dirOf(t.clientX,t.clientY,n);
      else if(k==='btn'){const b=btnAt(t.clientX,t.clientY,36);if(b)n[b]=true;}}
    apply(n);
  }
  const onSys=t=>t.target&&t.target.closest&&t.target.closest('.sys');
  document.addEventListener('touchstart',e=>{
    body.classList.add('touch');Snd.resume();
    for(const t of e.changedTouches){if(onSys(t))continue;
      if(inRect(dp,t.clientX,t.clientY,34))owner.set(t.identifier,'dpad');
      else if(btnAt(t.clientX,t.clientY,24))owner.set(t.identifier,'btn');}
    recompute(e.touches);e.preventDefault();
  },{passive:false});
  document.addEventListener('touchmove',e=>{recompute(e.touches);e.preventDefault();},{passive:false});
  const tEnd=e=>{
    for(const t of e.changedTouches)owner.delete(t.identifier);
    for(const id of[...owner.keys()])if(![...e.touches].some(t=>t.identifier===id))owner.delete(id);
    recompute(e.touches);Snd.resume();
    if(e.cancelable)e.preventDefault();
  };
  document.addEventListener('touchend',tEnd,{passive:false});
  document.addEventListener('touchcancel',tEnd,{passive:false});
  ['gesturestart','gesturechange','gestureend','dblclick'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
  const releaseAll=()=>{owner.clear();apply({left:false,right:false,up:false,down:false,a:false,b:false});};
  addEventListener('blur',releaseAll);document.addEventListener('visibilitychange',releaseAll);
  /* --- マウス（PCで ?touch 表示にしたとき用） --- */
  let mouse=null;
  const mouseList=()=>mouse?[{identifier:'m',clientX:mouse.x,clientY:mouse.y}]:[];
  addEventListener('mousedown',e=>{
    if(inRect(dp,e.clientX,e.clientY,0))owner.set('m','dpad');else if(btnAt(e.clientX,e.clientY,0))owner.set('m','btn');else return;
    mouse={x:e.clientX,y:e.clientY};recompute(mouseList());Snd.resume();
  });
  addEventListener('mousemove',e=>{if(mouse){mouse={x:e.clientX,y:e.clientY};recompute(mouseList());}});
  addEventListener('mouseup',()=>{if(mouse){mouse=null;owner.delete('m');recompute([]);}});
  /* --- 右上のボタン --- */
  const bp=document.getElementById('btnPause'),bm=document.getElementById('btnMute'),bf=document.getElementById('btnFull');
  bp.addEventListener('pointerup',e=>{e.preventDefault();Snd.resume();inp.p.pause=true;});
  bm.addEventListener('pointerup',e=>{e.preventDefault();Snd.resume();Snd.setMute(!Snd.muted);});
  if(document.documentElement.requestFullscreen&&document.fullscreenEnabled)bf.classList.add('can');
  bf.addEventListener('pointerup',e=>{e.preventDefault();
    if(document.fullscreenElement)document.exitFullscreen();
    else document.documentElement.requestFullscreen().then(()=>{try{screen.orientation.lock('landscape');}catch(_){}}).catch(()=>{});});
  document.addEventListener('contextmenu',e=>e.preventDefault());
  try{if(localStorage.getItem('belugaMute')==='1')Snd.setMute(true);}catch(e){}
})();

/* =====================================================================
   ステージ定義
   ===================================================================== */
const STAGES=[
  {id:'tokyo',cont:'アジア',city:'日本・東京',tag:'東京タワーと富士山をながめて出発！',
   sky:['#59c6ff','#e6f7ff'],tile:{top:'#6ccf4f',body:'#a7703c',dark:'#84532a',brick:'#d9803a',hard:'#9aa0b4'},
   walker:0,birdCol:'#ffffff',bossHp:2},
  {id:'egypt',cont:'アフリカ',city:'エジプト・ギザ',tag:'ピラミッドの砂漠をわたれ！',
   sky:['#ffb75e','#ffe9b8'],tile:{top:'#f7dd95',body:'#dfae62',dark:'#bb8a3f',brick:'#c98a3c',hard:'#c9b48a'},
   walker:1,birdCol:'#d9b98a',bossHp:2},

/* =====================================================================
   レベル生成（ステージごとに固定の乱数で毎回同じマップ）
   ===================================================================== */
function genLevel(si){
  const rnd=mulberry32(9000+si*131),R=(a,b)=>a+Math.floor(rnd()*(b-a+1)),d=si/6;
  const target=120+si*12,grid=new Uint8Array(LW*ROWS);
  const enemies=[],coins=[],items=[],qc={},checks=[];
  const set=(c,r,t)=>{if(c>=0&&c<LW&&r>=0&&r<ROWS)grid[r*LW+c]=t;};
  const ground=(c0,c1)=>{for(let c=c0;c<c1;c++)for(let r=GROUND;r<ROWS;r++)set(c,r,1);};
  const walker=c=>enemies.push({type:'walk',x:c*TS+2,y:GROUND*TS-22,w:26,h:22,vx:0,vy:0,dir:-1,alive:true,dying:0,t:rnd()*9,skin:STAGES[si].walker});
  const bird=(c,y)=>enemies.push({type:'fly',x:c*TS,y,baseY:y,w:28,h:20,vx:0,vy:0,dir:-1,alive:true,dying:0,t:rnd()*9,skin:si});
  const urchin=c=>enemies.push({type:'urchin',x:c*TS+2,y:GROUND*TS-24,w:26,h:24,vx:0,vy:0,dir:1,alive:true,dying:0,t:rnd()*9});
  const coin=(x,y)=>coins.push({x,y,got:false,t:rnd()*6});
  const coinRow=(c,n,row)=>{for(let i=0;i<n;i++)coin(c*TS+i*TS+TS/2,row*TS+TS/2);};
  const coinArc=(c,n,base)=>{for(let i=0;i<n;i++)coin((c+i)*TS+TS/2,base*TS-Math.sin(i/(n-1)*Math.PI)*46+TS/2);};

  ground(0,12);let c=12,mid=false,star=false,n=0;
  // 仕掛けを「山札」から順に引く：どのステージにも一通り出る
  const kinds=['flat','blocks','gap','stairs','blocks','pillar','float','gap'];
  if(si>=1)kinds.push('urchin');if(si>=2)kinds.push('fly');if(si>=3)kinds.push('urchin','float','blocks');if(si>=5)kinds.push('gap','fly');
  let deck=[];
  const draw=()=>{if(!deck.length){deck=kinds.slice();for(let i=deck.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}}return deck.pop();};
  while(c<target){
    if(!mid&&c>target/2){ground(c,c+8);checks.push(c+3);c+=8;mid=true;continue;}
    const k=draw();n++;
    if(k==='flat'){
      const w=R(7,10);ground(c,c+w);
      for(let i=0,m=R(1,1+(d>.4?1:0));i<m;i++)walker(c+R(2,w-3));
      if(rnd()<.6)coinRow(c+2,R(3,5),GROUND-2);
      c+=w;
    }else if(k==='gap'){
      const gw=R(2,3);ground(c,c+3);ground(c+3+gw,c+3+gw+4);
      coinArc(c+2,gw+2,GROUND-2);
      if(rnd()<.4)walker(c+3+gw+2);
      c+=3+gw+4;
    }else if(k==='stairs'){
      const h=R(2,3),hs=[];for(let i=1;i<=h;i++)hs.push(i);hs.push(h);for(let i=h-1;i>=1;i--)hs.push(i);
      ground(c,c+hs.length*2+3);
      hs.forEach((hh,i)=>{for(let j=0;j<hh;j++){set(c+1+i*2,GROUND-1-j,5);set(c+2+i*2,GROUND-1-j,5);}});
      coin((c+h*2)*TS+15,(GROUND-h-2)*TS+15);coin((c+1+h*2)*TS+15,(GROUND-h-2)*TS+15);
      c+=hs.length*2+3;
    }else if(k==='pillar'){
      ground(c,c+14);
      const h1=R(2,3),h2=R(2,3);
      for(let j=0;j<h1;j++){set(c+3,GROUND-1-j,5);set(c+4,GROUND-1-j,5);}
      for(let j=0;j<h2;j++){set(c+10,GROUND-1-j,5);set(c+11,GROUND-1-j,5);}
      walker(c+6);if(d>.3&&rnd()<.6)walker(c+8);
      coin((c+3)*TS+TS,(GROUND-h1-2)*TS+15);coin((c+10)*TS+TS,(GROUND-h2-2)*TS+15);
      c+=14;
    }else if(k==='blocks'){
      const w=R(9,12);ground(c,c+w);const L=R(3,5),s=c+2;
      let hasQ=false;
      for(let i=0;i<L;i++){
        const q=(i%2===1)||rnd()<.3;
        if(q){set(s+i,6,3);hasQ=true;
          let ct='coin';
          if(rnd()<.32)ct='heart';
          if(!star&&c>target*.55&&rnd()<.5){ct='star';star=true;}
          qc[(6*LW)+s+i]=ct;
        }else set(s+i,6,2);
      }
      if(!hasQ){set(s+1,6,3);qc[6*LW+s+1]='coin';}
      coinRow(s,L,4);
      if(rnd()<.6)walker(c+R(w-4,w-2));
      if(d>.5&&rnd()<.5)walker(c+w-6);
      c+=w;
    }else if(k==='float'){
      ground(c,c+2);
      const rows=[7,6,7];let px=c+4;
      rows.forEach((r,i)=>{for(let j=0;j<3;j++)set(px+j,r,2);coinRow(px,3,r-2);px+=3+2;});
      const end=px-2;
      if(d>.4&&rnd()<.7)bird(c+9,R(120,170));
      ground(end,end+5);
      c=end+5;
    }else if(k==='fly'){
      const w=R(9,12);ground(c,c+w);
      for(let i=0,m=R(2,3);i<m;i++)bird(c+R(3,w+4),R(110,200));
      coinRow(c+3,4,GROUND-4);
      c+=w;
    }else if(k==='urchin'){
      const w=13;ground(c,c+w);
      urchin(c+4);urchin(c+10);coinArc(c+3,4,GROUND-2);coinArc(c+9,4,GROUND-2);
      if(d>.5)walker(c+7);
      c+=w;
    }
  }
  /* --- ボスアリーナ --- */
  ground(c,c+8);checks.push(c+2);c+=8;
  const arenaLeft=c;const cols=c+24;ground(c,cols);
  for(let r=0;r<GROUND;r++)set(cols-1,r,5);
  return {grid,cols,enemies,coins,items,qc,checks,arenaLeft,star};
}

let state='title',stageIdx=0;

try{const s=JSON.parse(localStorage.getItem('belugaAction.v1'));if(s&&typeof s.cleared==='number')save=s;}catch(e){}
function writeSave(){try{localStorage.setItem('belugaAction.v1',JSON.stringify(save));}catch(e){}}
let G=null,menu={items:[],sel:0},hits=[],T=0,stTimer=0,shake=0,introT=0;
let selStage=0;

function setState(s){state=s;stTimer=0;clearEdges();}
function setMenu(items){menu={items,sel:0};}

function toTitle(){
  const it=[{label:'はじめから',fn:()=>newRun(0)}];
  if(save.cleared>0){it.push({label:'つづきから　STAGE '+Math.min(7,save.cleared+1),fn:()=>newRun(Math.min(6,save.cleared))});
    it.push({label:'ステージえらび',fn:()=>{selStage=Math.min(6,save.cleared);setState('select');}});}
  setMenu(it);setState('title');Music.play(0);
}
function newRun(si){run={lives:3,score:0,fish:0};stageIdx=si;startIntro();}
function startIntro(){setState('intro');Music.stop();introT=0;}
function startStage(si){
  stageIdx=si;const L=genLevel(si),S=STAGES[si];
  G={S,L,grid:L.grid,cols:L.cols,qc:L.qc,enemies:L.enemies,coins:L.coins,items:L.items,
    p:{x:6*TS,y:GROUND*TS-26,w:24,h:26,vx:0,vy:0,face:1,onGround:false,coyote:0,jumpBuf:0,hp:3,inv:0,star:0,dead:false,deadT:0,t:0,bubbleCd:0,walk:0},
    cam:{x:0},bubbles:[],parts:[],pops:[],bumps:[],t:0,
    cp:{col:6,idx:-1},checks:L.checks.map((c,i)=>({x:c*TS,active:false})),
    locked:false,mode:'run',wonT:0,cageOpen:0,friendX:0,
    boss:{x:(L.cols-11)*TS,y:GROUND*TS-44,w:64,h:44,vx:0,vy:0,dir:-1,hp:S.bossHp,max:S.bossHp,state:'wait',timer:1,hops:0,hurt:0,onGround:false,hitWall:false,rot:0,t:0}};
  G.friend={x:(L.cols-4)*TS-8,y:GROUND*TS};
  setState('play');Music.play(si+1);
}
function respawn(){
  const p=G.p,cp=G.cp;
  p.x=cp.col*TS;p.y=GROUND*TS-26-1;p.vx=p.vy=0;p.hp=3;p.inv=2;p.star=0;p.dead=false;p.deadT=0;
  G.cam.x=clamp(p.x-W*.4,0,G.cols*TS-W);
  G.locked=false;
  // ボス戦の壁を取り除く
  for(let r=0;r<GROUND;r++)for(let c=G.L.arenaLeft-4;c<G.L.arenaLeft+30;c++)if(c<G.cols-1&&G.grid[r*LW+c]===9)G.grid[r*LW+c]=0;
  const b=G.boss;b.state='wait';b.x=(G.cols-11)*TS;b.y=GROUND*TS-44;b.vx=b.vy=0;b.hurt=0;b.hops=0;
  G.bubbles.length=0;
}

/* =====================================================================
   物理
   ===================================================================== */
const GRAV=1900,SPEED=185,JUMP=650,MAXF=760;
function solid(c,r){if(c<0||c>=G.cols)return true;if(r<0||r>=ROWS)return false;return G.grid[r*LW+c]>0;}
function moveEntity(e,dt){
  e.hitWall=false;
  e.x+=e.vx*dt;
  const dx=Math.sign(e.vx);
  if(dx!==0){
    const r0=Math.floor(e.y/TS),r1=Math.floor((e.y+e.h-.01)/TS),c0=Math.floor(e.x/TS),c1=Math.floor((e.x+e.w-.01)/TS);
    for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++)if(solid(c,r)){
      if(dx>0)e.x=Math.min(e.x,c*TS-e.w);else e.x=Math.max(e.x,(c+1)*TS);e.vx=0;e.hitWall=true;}
  }
  e.y+=e.vy*dt;e.onGround=false;e.bump=null;
  const dy=Math.sign(e.vy);
  if(dy!==0){
    const r0=Math.floor(e.y/TS),r1=Math.floor((e.y+e.h-.01)/TS),c0=Math.floor(e.x/TS),c1=Math.floor((e.x+e.w-.01)/TS);
    let best=null,bd=1e9;
    for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++)if(solid(c,r)){
      if(dy>0){e.y=Math.min(e.y,r*TS-e.h);e.onGround=true;}
      else{e.y=Math.max(e.y,(r+1)*TS);const dd=Math.abs(c*TS+TS/2-(e.x+e.w/2));if(dd<bd){bd=dd;best={c,r};}}
      e.vy=0;
    }
    e.bump=best;
  }
}
const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;

function spawnParts(x,y,n,colors,spd=120,life=.6){
  for(let i=0;i<n;i++){const a=Math.random()*TAU,s=spd*(.4+Math.random()*.8);
    G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-40,life,max:life,c:colors[i%colors.length],r:2+Math.random()*2.5});}
}
function addScore(n,x,y){run.score+=n;if(x!==undefined)G.pops.push({x,y,t:.8,s:'+'+n});}
function getFish(x,y){
  run.fish++;addScore(10);SFX.coin();
  if(run.fish%50===0){run.lives++;SFX.up();G.pops.push({x,y,t:1.2,s:'1UP!'});}
}

function hitBlock(c,r){
  const i=r*LW+c,t=G.grid[i];
  G.bumps.push({c,r,t:0});SFX.bump();
  if(t===3){
    G.grid[i]=4;const ct=G.qc[i]||'coin',x=c*TS+TS/2,y=r*TS;
    if(ct==='coin'){getFish(x,y);addScore(0);spawnParts(x,y-6,6,['#ffd23f','#fff'],110,.5);G.items.push({type:'popcoin',x,y:y-10,t:0});}
    else G.items.push({type:ct,x:x-11,y:y-26,w:22,h:22,t:0,rise:26,got:false});
  }
}

function hurtPlayer(){
  const p=G.p;if(p.inv>0||p.star>0||p.dead||G.mode==='won')return;
  p.hp--;SFX.hurt();
  if(p.hp<=0){killPlayer();return;}
  p.inv=1.8;p.vy=-330;p.vx=-p.face*170;
}
function killPlayer(){
  const p=G.p;if(p.dead)return;
  p.dead=true;p.deadT=0;p.vy=-560;p.vx=0;p.hp=0;Music.stop();SFX.die();
}

function shoot(){
  const p=G.p;if(p.bubbleCd>0||G.bubbles.length>=3)return;
  p.bubbleCd=.28;SFX.bubble();
  G.bubbles.push({x:p.x+p.w/2+p.face*14,y:p.y+9,vx:p.face*250+p.vx*.25,vy:-45,t:0,r:8});
}

/* =====================================================================
   更新：プレイ
   ===================================================================== */
function updatePlay(dt){
  if(inp.p.pause){setState('pause');setMenu([{label:'つづける',fn:()=>{setState('play');}},{label:'タイトルへ',fn:()=>{Music.stop();toTitle();}}]);return;}
  const p=G.p,S=G.S;G.t+=dt;p.t+=dt;
  if(shake>0)shake=Math.max(0,shake-dt);
  /* --- プレイヤー --- */
  if(p.dead){
    p.deadT+=dt;p.vy=Math.min(p.vy+GRAV*dt,MAXF);p.y+=p.vy*dt;
    if(p.deadT>1.7){
      run.lives--;
      if(run.lives<=0){setState('gameover');setMenu([{label:'もういちど',fn:()=>{run.lives=3;run.score=0;startIntro();}},{label:'タイトルへ',fn:()=>toTitle()}]);Music.stop();}
      else{respawn();Music.play(stageIdx+1);}
    }
  }else{
    const frozen=G.mode==='won';
    const jumpH=inp.h.a||inp.h.kup,jumpP=inp.p.a||inp.p.kup;
    let dir=frozen?0:((inp.h.right?1:0)-(inp.h.left?1:0));
    const acc=p.onGround?1700:1100;
    p.vx=approach(p.vx,dir*SPEED,(dir!==0?acc:(p.onGround?1500:350))*dt);
    if(dir)p.face=dir;
    if(!frozen&&jumpP)p.jumpBuf=.12;else p.jumpBuf-=dt;
    p.coyote=p.onGround?.1:p.coyote-dt;
    if(p.jumpBuf>0&&p.coyote>0){p.vy=-JUMP;p.jumpBuf=0;p.coyote=0;p.onGround=false;SFX.jump();}
    const g=(p.vy<0&&!jumpH)?GRAV*2.3:GRAV;
    p.vy=Math.min(p.vy+g*dt,MAXF);
    p.bubbleCd-=dt;if(!frozen&&inp.p.b)shoot();
    if(p.inv>0)p.inv-=dt;if(p.star>0)p.star-=dt;
    if(G.mode==='won'&&G.wonT>1.6&&p.onGround&&Math.floor(G.wonT*1.6)!==Math.floor((G.wonT-dt)*1.6)){p.vy=-420;}
    moveEntity(p,dt);
    if(p.bump){const t=G.grid[p.bump.r*LW+p.bump.c];if(t===2||t===3)hitBlock(p.bump.c,p.bump.r);}
    p.walk+=Math.abs(p.vx)*dt*.09;
    p.x=Math.max(p.x,G.cam.x);
    if(p.y>H+40)killPlayer();
  }
  /* --- カメラ --- */
  const maxCam=G.cols*TS-W;
  if(!G.locked){
    const tx=clamp(p.x+p.w/2-W*.4,0,maxCam);
    if(tx>G.cam.x)G.cam.x+=(tx-G.cam.x)*Math.min(1,dt*9);
    const wc=Math.floor(maxCam/TS);
    if(!p.dead&&p.x>(wc+1)*TS+6&&G.boss.hp>0){
      G.locked=true;
      for(let r=0;r<GROUND;r++)G.grid[r*LW+wc]=9;
      G.boss.state='walk';G.boss.timer=1.2;G.boss.hops=0;
    }
  }else G.cam.x+=(maxCam-G.cam.x)*Math.min(1,dt*5);
  /* --- チェックポイント --- */
  G.checks.forEach((k,i)=>{if(!k.active&&p.x>k.x&&!p.dead){k.active=true;G.cp.col=Math.floor(k.x/TS);SFX.power();spawnParts(k.x+8,GROUND*TS-40,10,['#ffd23f','#fff','#ff9ec4'],130,.8);}});
  /* --- 敵 --- */
  for(const e of G.enemies){
    if(!e.alive){e.dying+=dt;if(e.type!=='none'){e.vy+=GRAV*.6*dt;e.y+=e.vy*dt;e.x+=e.vx*dt;}continue;}
    if(e.x>G.cam.x+W+90||e.x+e.w<G.cam.x-140)continue;
    e.t+=dt;
    if(e.type==='walk'){
      e.vx=e.dir*(42+STAGES.indexOf(S)*3);e.vy=Math.min(e.vy+GRAV*dt,MAXF);
      moveEntity(e,dt);
      if(e.hitWall)e.dir*=-1;
      else if(e.onGround){const fx=e.dir>0?e.x+e.w+3:e.x-3;if(!solid(Math.floor(fx/TS),Math.floor((e.y+e.h+3)/TS)))e.dir*=-1;}
      if(e.y>H+60)e.alive=false,e.type='none';
    }else if(e.type==='fly'){
      e.x+=e.dir*(38+STAGES.indexOf(S)*3)*dt;e.y=e.baseY+Math.sin(e.t*2.2)*32;
    }
  }
  /* --- あわ --- */
  for(const b of G.bubbles){
    b.t+=dt;b.vy+=90*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.vx*=.995;
    if(b.t>1.5||solid(Math.floor(b.x/TS),Math.floor(b.y/TS))){b.dead=true;spawnParts(b.x,b.y,5,['#dff6ff','#fff'],60,.35);SFX.pop();continue;}
    for(const e of G.enemies)if(e.alive&&e.type!=='none'&&ov({x:b.x-b.r,y:b.y-b.r,w:b.r*2,h:b.r*2},e)){
      if(e.type==='urchin'){b.dead=true;spawnParts(b.x,b.y,5,['#dff6ff'],60,.35);SFX.pop();}
      else{killEnemy(e,b.vx>0?1:-1);b.dead=true;}
      break;
    }
    const bo=G.boss;
    if(!b.dead&&bo.hp>0&&bo.state!=='wait'&&bo.state!=='dying'&&ov({x:b.x-b.r,y:b.y-b.r,w:b.r*2,h:b.r*2},bo)){b.dead=true;spawnParts(b.x,b.y,6,['#dff6ff','#fff'],70,.4);SFX.pop();}
  }
  G.bubbles=G.bubbles.filter(b=>!b.dead);
  /* --- 敵との当たり判定 --- */
  if(!p.dead)for(const e of G.enemies){
    if(!e.alive||e.type==='none'||!ov(p,e))continue;
    if(p.star>0){killEnemy(e,p.face);continue;}
    if(e.type!=='urchin'&&p.vy>0&&(p.y+p.h)-e.y<18){
      killEnemy(e,0,true);p.vy=-(inp.h.a||inp.h.kup?520:360);p.onGround=false;
    }else hurtPlayer();
  }
  /* --- 魚コイン・アイテム --- */
  if(!p.dead){
    for(const c of G.coins){if(c.got)continue;c.t+=dt;
      if(Math.abs(c.x-(p.x+p.w/2))<18&&Math.abs(c.y-(p.y+p.h/2))<20){c.got=true;getFish(c.x,c.y);spawnParts(c.x,c.y,4,['#ffd23f','#fff'],80,.4);}}
    for(const it of G.items){
      if(it.type==='popcoin'){it.t+=dt;continue;}
      if(it.got)continue;it.t+=dt;if(it.rise>0){const d=Math.min(it.rise,110*dt);it.y-=d;it.rise-=d;continue;}
      if(ov(p,it)){it.got=true;
        if(it.type==='heart'){if(p.hp<3){p.hp++;}else addScore(500,it.x,it.y);SFX.power();spawnParts(it.x+11,it.y+10,10,['#ff7aa8','#fff'],120,.7);}
        else{p.star=9;addScore(1000,it.x,it.y);SFX.power();Music.play(0);setTimeout(()=>{if(G&&state==='play'&&!G.p.dead)Music.play(stageIdx+1);},9000);spawnParts(it.x+11,it.y+10,14,['#ffe14a','#fff','#7ad7ff'],150,.8);}
      }
    }
  }
  G.items=G.items.filter(i=>!(i.type==='popcoin'&&i.t>.35));
  G.bumps.forEach(b=>b.t+=dt);G.bumps=G.bumps.filter(b=>b.t<.2);
  /* --- ボス --- */
  updateBoss(dt);
  /* --- ステージクリア進行 --- */
  if(G.mode==='won'){
    G.wonT+=dt;
    G.cageOpen=clamp((G.wonT-.4)/1.0,0,1);
    if(G.wonT>1.6){const tx=G.p.x+G.p.w/2+(G.p.face>0?-44:44);G.friend.hop=Math.abs(Math.sin(G.wonT*5))*10;G.friend.x+=(clamp(tx,G.cam.x+40,G.cols*TS-90)-G.friend.x)*Math.min(1,dt*2.2);}
    if(G.wonT>1.6&&Math.floor(G.wonT*6)!==Math.floor((G.wonT-dt)*6))G.parts.push({x:G.friend.x+Math.random()*30-8,y:GROUND*TS-40,vx:Math.random()*30-15,vy:-60-Math.random()*50,life:1.1,max:1.1,c:'heart',r:6});
    if(G.wonT>4.2)finishStage();
  }
  /* --- パーティクル --- */
  for(const q of G.parts){q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=(q.c==='heart'?-20:260)*dt;}
  G.parts=G.parts.filter(q=>q.life>0);
  for(const q of G.pops){q.t-=dt;q.y-=30*dt;}G.pops=G.pops.filter(q=>q.t>0);
}
function killEnemy(e,dir,stomp){
  e.alive=false;e.dying=0;
  if(stomp){e.squash=true;e.vy=0;e.vx=0;SFX.stomp();addScore(100,e.x,e.y);spawnParts(e.x+e.w/2,e.y+e.h,6,['#fff','#ffe08a'],90,.4);}
  else{e.vy=-260;e.vx=dir*90;SFX.pop();addScore(100,e.x,e.y);spawnParts(e.x+e.w/2,e.y+e.h/2,6,['#dff6ff','#fff'],90,.4);}
}
function updateBoss(dt){
  const b=G.boss,p=G.p;if(b.hp<=0&&b.state==='gone')return;
  if(b.state==='wait'||b.state==='gone')return;
  b.t+=dt;if(b.hurt>0)b.hurt-=dt;
  const sp=1+stageIdx*.09,dirTo=(p.x+p.w/2)<(b.x+b.w/2)?-1:1;
  if(b.state==='dying'){b.vy+=GRAV*.7*dt;b.y+=b.vy*dt;b.x+=b.vx*dt;b.rot+=dt*7;if(b.y>H+120)b.state='gone';return;}
  const limitR=(G.cols-1)*TS;
  b.vy=Math.min(b.vy+GRAV*.8*dt,MAXF);
  if(b.state==='walk'){
    if(b.onGround){b.vx*=.75;b.timer-=dt;
      if(b.timer<=0){
        if(b.hops>=3){b.state='tele';b.timer=.75;b.dir=dirTo;b.vx=0;SFX.tele();}
        else{b.hops++;b.vy=-430;b.vx=dirTo*110*sp;b.dir=dirTo;b.timer=.45;}
      }
    }
  }else if(b.state==='tele'){b.timer-=dt;b.vx=0;if(b.timer<=0){b.state='charge';b.vx=b.dir*250*sp;}}
  else if(b.state==='charge'){b.vx=b.dir*250*sp;}
  else if(b.state==='stun'){b.timer-=dt;b.vx=0;if(b.timer<=0){b.state='walk';b.hops=0;b.timer=.4;}}
  const wasAir=!b.onGround;
  moveEntity(b,dt);
  if(b.x+b.w>limitR){b.x=limitR-b.w;if(b.vx>0)b.vx=0;b.hitWall=true;}
  if(b.state==='charge'&&b.hitWall){b.state='stun';b.timer=1.5;b.vx=0;shake=.35;SFX.boom();spawnParts(b.x+b.w/2,b.y,10,['#fff','#ffe14a'],130,.7);}
  if(wasAir&&b.onGround&&b.state==='walk'){shake=Math.max(shake,.08);}
  /* --- プレイヤーとの接触 --- */
  if(p.dead||G.mode==='won'||!ov(p,b))return;
  if(b.hurt>0)return;
  const stomp=p.vy>0&&(p.y+p.h)-b.y<22;
  if(stomp||p.star>0){
    b.hp--;b.hurt=1.3;SFX.stomp();SFX.boom();shake=.25;
    spawnParts(b.x+b.w/2,b.y+6,14,['#fff','#ffe14a','#7ad7ff'],150,.7);
    if(stomp){p.vy=-520;p.onGround=false;}
    if(b.hp<=0){b.state='dying';b.vy=-460;b.vx=dirTo*70;b.rot=0;addScore(1000,b.x,b.y-10);G.mode='won';G.wonT=0;Music.stop();SFX.clear();}
    else{b.state='walk';b.hops=0;b.timer=.7;b.vx=0;}
  }else if(b.state!=='stun')hurtPlayer();
}
function finishStage(){
  run.score+=500+G.p.hp*200;
  save.cleared=Math.max(save.cleared,stageIdx+1);writeSave();
  setState('clear');
}

  hits=[];
  for(let i=0;i<7;i++){
    const row=i<4?0:1,cnt=row?3:4,ix=row?i-4:i,cw=140,ch=100,gap=12,x=W/2-(cnt*cw+(cnt-1)*gap)/2+ix*(cw+gap),y=68+row*(ch+16);
    const open=i<=save.cleared,sel=selStage===i,S=STAGES[i];
    rrect(x,y,cw,ch,14);const g=ctx.createLinearGradient(0,y,0,y+ch);g.addColorStop(0,S.sky[0]);g.addColorStop(1,S.sky[1]);
    ctx.fillStyle=open?g:'#5a6675';ctx.fill();ctx.lineWidth=sel?5:2.5;ctx.strokeStyle=sel?'#ffd23f':'#fff';ctx.stroke();
    if(open){txt(String(i+1),x+22,y+22,26,'#fff','center','rgba(20,50,100,.8)',5);
      txt(S.cont,x+cw/2+8,y+22,14,'#fff','center','rgba(20,50,100,.8)',4);
      txt(S.city,x+cw/2,y+56,12,'#fff','center','rgba(20,50,100,.8)',3.5);
      if(save.cleared>i)drawBeluga(x+cw/2,y+ch-6,1,T+i,{s:.5,bow:true});
      else txt('NEW!',x+cw/2,y+ch-16,14,'#ffe14a','center','#a04a00',3.5);}
    else{txt('🔒',x+cw/2,y+40,30,'#fff');txt('STAGE '+(i+1),x+cw/2,y+78,12,'#e3ebf5');}
    hits.push({x,y,w:cw,h:ch,idx:i,fn:()=>{if(open){selStage=i;newRun(i);}}});
  }
  hits.push({x:10,y:H-44,w:110,h:34,idx:99,fn:()=>toTitle()});
  rrect(10,H-44,110,34,17);ctx.fillStyle='rgba(255,255,255,.88)';ctx.fill();txt('もどる（B）',65,H-27,14,'#24507f');
}
function drawIntro(){
  const S=STAGES[stageIdx],g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,S.sky[0]);g.addColorStop(1,S.sky[1]);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const fake={S,cam:{x:T*30},t:T};const sv=G;G=fake;
  try{BG[S.id]();}catch(e){}G=sv;
  rect(0,0,W,H,'rgba(0,20,50,.35)');
  const k=Math.min(1,introT*3);ctx.globalAlpha=k;
  txt('STAGE '+(stageIdx+1),W/2,86,54,'#fff','center','#e4741a',10);
  txt(S.cont,W/2,140,26,'#ffe14a','center','#1b3a6a',6);
  txt(S.city,W/2,176,30,'#fff','center','#1b3a6a',7);
  txt(S.tag,W/2,212,15,'#fff','center','#1b3a6a',4);
  drawBeluga(W/2-30,300,1,T,{s:1.2,walk:true});drawBeluga(W/2+70,296,-1,T+1,{s:.9,bow:true,air:true});
  drawOrca({x:W/2+94,y:258,w:64,h:44,state:'idle',t:T,rot:0},0,0,-1);
  txt('！',W/2+72,244,20,'#ff3a3a','center','#fff',4);
  txt('のこり ×'+run.lives,W/2-100,300,15,'#fff','center','#1b3a6a',4);
  ctx.globalAlpha=.6+.4*Math.sin(T*5);txt('A / タップ でスタート',W/2,340,13,'#fff','center','#1b3a6a',3.5);ctx.globalAlpha=1;
}
function drawOverlayBox(title,color,sub){
  rect(0,0,W,H,'rgba(4,16,40,.62)');txt(title,W/2,90,46,color,'center','#12315e',9);if(sub)txt(sub,W/2,132,15,'#fff','center','#12315e',4);
}
function drawMenuList(y0){
  hits=[];menu.items.forEach((it,i)=>uiButton(it.label,W/2-115,y0+i*48,230,38,i,it.fn));
}
function drawClear(){
  drawWorld();drawHUD();drawOverlayBox('ステージクリア！','#ffe14a','ともだちを たすけだしたよ！');
  const S=STAGES[stageIdx];
  txt(S.cont+'　'+S.city,W/2,162,16,'#cfe8ff','center','#12315e',4);
  drawBeluga(W/2-24,262,1,T,{s:1.4,air:true});drawBeluga(W/2+40,258,-1,T+1,{s:1.2,bow:true,air:true});
  for(let i=0;i<8;i++){const a=T*1.5+i;heart(W/2+8+Math.cos(a)*110,255+Math.sin(a*1.3)*22,14,'#ff7aa8');}
  txt('ボーナス  '+(500+G.p.hp*200),W/2,196,15,'#fff','center','#12315e',4);
  txt('スコア  '+run.score,W/2,218,17,'#ffe98a','center','#12315e',4);
  if(stTimer>.9){ctx.globalAlpha=.6+.4*Math.sin(T*5);txt(stageIdx>=6?'A / タップ で つづきへ':'A / タップ で つぎのステージへ',W/2,332,15,'#fff','center','#12315e',4);ctx.globalAlpha=1;}
}
function drawGameOver(){
  drawWorld();drawHUD();drawOverlayBox('ゲームオーバー','#ff9a9a','あきらめないで！ もういちど ちょうせん');
  drawBeluga(W/2,250,1,T,{s:1.3});drawMenuList(276-70+0);
}
function drawPause(){
  drawWorld();drawHUD();drawOverlayBox('ポーズ','#fff');drawMenuList(150);
}
const ENDING_NAMES=['アジア','アフリカ','ヨーロッパ','北アメリカ','南アメリカ','オセアニア','南極'];
function drawEnding(){
  drawOcean(T);rect(0,0,W,H,'rgba(255,220,240,.15)');
  for(let i=0;i<40;i++){const x=(hash(i)*W+T*20*(hash(i+3)-.5))%W,y=(hash(i+9)*H+T*40*(.5+hash(i+5)))%H;heart(x,y,6+hash(i+1)*6,['#ff7aa8','#ffd23f','#7ad7ff','#b6f28a'][i%4]);}
  txt('ぜんぶの なかまを たすけたよ！',W/2,56,28,'#fff','center','#e4741a',7);
  txt('ありがとう、ベルーガ！',W/2,96,20,'#ffe14a','center','#12315e',5);
  for(let i=0;i<7;i++){const x=W/2+(i-3)*82,y=196+Math.abs(Math.sin(T*3+i*.7))*-18;
    drawBeluga(x,y,i%2?1:-1,T+i,{s:.85,bow:true,air:true});txt(ENDING_NAMES[i],x,212,10,'#fff','center','#12315e',3);}
  drawBeluga(W/2,290+Math.abs(Math.sin(T*3+2))*-20,1,T,{s:1.2,air:true});
  txt('おしまい',W/2,318,24,'#fff','center','#12315e',6);
  if(stTimer>2){ctx.globalAlpha=.6+.4*Math.sin(T*5);txt('A / タップ で タイトルへ',W/2,344,13,'#fff','center','#12315e',3.5);ctx.globalAlpha=1;}
}

/* =====================================================================
   メインループ
   ===================================================================== */
function confirm(){return inp.p.a;}
function updateMenuKeys(){
  if(inp.p.up||inp.p.left){menu.sel=(menu.sel+menu.items.length-1)%menu.items.length;SFX.select();}
  if(inp.p.down||inp.p.right){menu.sel=(menu.sel+1)%menu.items.length;SFX.select();}
  if(inp.p.a){SFX.ok();menu.items[menu.sel].fn();}
}
function update(dt){
  T+=dt;stTimer+=dt;
  if(state==='title')updateMenuKeys();
  else if(state==='select'){
    const n=7,mx=Math.min(6,save.cleared);
    if(inp.p.left)selStage=Math.max(0,selStage-1);if(inp.p.right)selStage=Math.min(mx,selStage+1);
    if(inp.p.up)selStage=Math.max(0,selStage-4);if(inp.p.down)selStage=Math.min(mx,selStage+4);
    if(inp.p.left||inp.p.right||inp.p.up||inp.p.down)SFX.select();
    if(inp.p.a){SFX.ok();newRun(selStage);}
    if(inp.p.b||inp.p.pause)toTitle();
  }
  else if(state==='intro'){introT+=dt;if(introT>.5&&(inp.p.a||introT>3.2)){startStage(stageIdx);}}
  else if(state==='play')updatePlay(dt);
  else if(state==='pause'){if(inp.p.pause){setState('play');}else updateMenuKeys();}
  else if(state==='clear'){if(stTimer>.9&&inp.p.a){SFX.ok();if(stageIdx>=6){setState('ending');Music.play(0);}else{stageIdx++;startIntro();}}}
  else if(state==='gameover')updateMenuKeys();
  else if(state==='ending'){if(stTimer>2&&inp.p.a)toTitle();}
  Music.update();
}
function render(){
  ctx.setTransform(scale,0,0,scale,0,0);ctx.clearRect(0,0,W,H);
  if(state!=='title'&&state!=='select'&&state!=='pause'&&state!=='gameover')hits=[];
  switch(state){
    case 'title':drawTitle();break;
    case 'select':drawSelect();break;
    case 'intro':drawIntro();break;
    case 'play':drawWorld();drawHUD();break;
    case 'pause':drawPause();break;
    case 'clear':drawClear();break;
    case 'gameover':drawGameOver();break;
    case 'ending':drawEnding();break;
  }
}
/* 画面タップ（メニュー／進行） */
cv.addEventListener('pointerdown',e=>{
  Snd.resume();
  const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
  for(const b of hits)if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){if(b.idx!==99&&state!=='select')menu.sel=b.idx;SFX.ok();b.fn();return;}
  if(state==='intro'||state==='clear'||state==='ending')inp.p.a=true;
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')inp.p.pause=true;});
/* 縦向きのときは止める */
function portraitBlocked(){return document.body.classList.contains('touch')&&innerHeight>innerWidth;}

let last=performance.now(),acc=0;
function frame(now){
  requestAnimationFrame(frame);
  let d=(now-last)/1000;last=now;if(d>.25)d=.25;
  if(portraitBlocked()){if(state==='play')inp.p.pause=true;else return;}
  acc+=d;let n=0;
  while(acc>=1/60&&n<6){update(1/60);clearEdges();acc-=1/60;n++;}
  if(n===6)acc=0;
  render();
}
toTitle();
requestAnimationFrame(frame);
/* テスト・デバッグ用フック */
window.__beluga={inp,get G(){return G},get state(){return state},startStage,newRun,run,save,STAGES};
</script>
