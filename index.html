<style>
  html,body{margin:0;height:100%;background:#0b1d33;overflow:hidden;overscroll-behavior:none;

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function ell(x,y,rx,ry,fill,rot=0){ctx.beginPath();ctx.ellipse(x,y,Math.max(.01,rx),Math.max(.01,ry),rot,0,TAU);ctx.fillStyle=fill;ctx.fill();}
function rect(x,y,w,h,fill){ctx.fillStyle=fill;ctx.fillRect(x,y,w,h);}
function poly(p,fill){ctx.beginPath();ctx.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)ctx.lineTo(p[i],p[i+1]);ctx.closePath();ctx.fillStyle=fill;ctx.fill();}
function rrect(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);}
function txt(s,x,y,size,color,align='center',stroke,lw){
  ctx.font='800 '+size+'px '+FONT;ctx.textAlign=align;ctx.textBaseline='middle';
  if(stroke){ctx.lineJoin='round';ctx.lineWidth=lw||size*.22;ctx.strokeStyle=stroke;ctx.strokeText(s,x,y);}
  ctx.fillStyle=color;ctx.fillText(s,x,y);
}
function heartPath(x,y,s){
  ctx.beginPath();ctx.moveTo(x,y+s*.3);
  ctx.bezierCurveTo(x,y,x-s*.5,y,x-s*.5,y+s*.3);ctx.bezierCurveTo(x-s*.5,y+s*.6,x,y+s*.8,x,y+s);
  ctx.bezierCurveTo(x,y+s*.8,x+s*.5,y+s*.6,x+s*.5,y+s*.3);ctx.bezierCurveTo(x+s*.5,y,x,y,x,y+s*.3);
}
function heart(x,y,s,fill,stroke){heartPath(x,y,s);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.lineWidth=1.5;ctx.strokeStyle=stroke;ctx.stroke();}}
function starShape(x,y,r,fill,rot=0){
  ctx.beginPath();for(let i=0;i<10;i++){const a=rot-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}
  ctx.closePath();ctx.fillStyle=fill;ctx.fill();
}

      this.master=this.ctx.createGain();this.master.gain.value=this.muted?0:.5;this.master.connect(this.ctx.destination);}catch(e){}
  },
  resume(){this.init();if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();},
  setMute(m){this.muted=m;if(this.master)this.master.gain.value=m?0:.5;
    document.getElementById('btnMute').classList.toggle('off',m);try{localStorage.setItem('belugaMute',m?'1':'0');}catch(e){}},
  tone(f,d,type='square',v=.12,to=null,delay=0){
    if(!this.ctx||this.ctx.state!=='running')return;
    const t=this.ctx.currentTime+delay,o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(this.master);o.start(t);o.stop(t+d+.02);
  },
  noise(d,v=.15,delay=0){
    if(!this.ctx||this.ctx.state!=='running')return;
    const t=this.ctx.currentTime+delay,n=Math.floor(this.ctx.sampleRate*d),b=this.ctx.createBuffer(1,n,this.ctx.sampleRate),a=b.getChannelData(0);
    for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);
    const s=this.ctx.createBufferSource(),g=this.ctx.createGain();s.buffer=b;g.gain.value=v;s.connect(g);g.connect(this.master);s.start(t);
  }
};

/* --- BGM：ステージごとに手書きの曲 ---

Snd.note=function(f,d,type,v,delay,dec){
  if(!this.ctx||this.ctx.state!=='running')return;
  const t=this.ctx.currentTime+delay,o=this.ctx.createOscillator(),g=this.ctx.createGain();

  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.012);
  if(dec)g.gain.exponentialRampToValueAtTime(.0001,t+d);            // はじく音（こと・ベル）
  else{g.gain.setValueAtTime(v,t+d*.75);g.gain.exponentialRampToValueAtTime(.0001,t+d);}
  o.connect(g);g.connect(this.master);o.start(t);o.stop(t+d+.03);
};

function parseTrack(s){ // 音名の列 → {m:MIDI番号, len:のばす長さ} の配列
  const tk=s.split(/\s+/).filter(x=>x&&x!=='|'),out=tk.map(()=>null),N={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
  for(let i=0;i<tk.length;i++){const m=/^([A-G])(#|b)?(\d)$/.exec(tk[i]);if(!m)continue;
    let len=1;while(tk[i+len]==='.')len++;
    out[i]={m:12*(+m[3]+1)+N[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0),len};}
  return out;
}

  id:-1,step:0,next:0,song:null,
  play(id){
    if(this.id===id)return;this.id=id;this.step=0;this.song=SONGS[id];
    this.next=Snd.ctx?Snd.ctx.currentTime+.08:0;
  },
  stop(){this.id=-1;},
  drum(ch,dl){
    if(ch==='k')Snd.tone(150,.13,'sine',.28,45,dl);
    else if(ch==='s')Snd.noise(.09,.08,dl);
    else if(ch==='h')Snd.noise(.025,.03,dl);
    else if(ch==='t'){Snd.tone(110,.26,'sine',.34,60,dl);Snd.noise(.05,.05,dl);}
    else if(ch==='d')Snd.tone(170,.16,'sine',.26,90,dl);
    else if(ch==='c')Snd.tone(420,.06,'triangle',.1,300,dl);
  },
  update(){
    if(this.id<0||!Snd.ctx||Snd.ctx.state!=='running')return;
    const now=Snd.ctx.currentTime;if(this.next<now-.5)this.next=now+.05;
    const s=this.song,dur=60/s.bpm/2;
    while(this.next<now+.25){
      const st=this.step,dl=this.next-now+(st%2&&s.swing?dur*s.swing:0);
      const n=s.L[st%s.L.length],b=s.B[st%s.B.length];
      if(n)Snd.note(mid(n.m),dur*n.len*.95,s.lead[0],s.lead[1],dl,s.lead[2]);
      if(b)Snd.note(mid(b.m),dur*b.len*.9,s.bass[0],s.bass[1],dl);
      this.drum(s.drum[st%s.drum.length],dl);
      this.step=st+1;this.next+=dur;
    }
  }
};

const inp={h:{},p:{}};
function press(n){if(!inp.h[n])inp.p[n]=true;inp.h[n]=true;}
function release(n){inp.h[n]=false;}
function clearEdges(){inp.p={};}
const KEYMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',
  Space:'a',KeyZ:'a',KeyK:'a',Enter:'a',KeyX:'b',KeyJ:'b',ShiftLeft:'b',ShiftRight:'b',Escape:'pause',KeyP:'pause'};
addEventListener('keydown',e=>{
  Snd.resume();
  if(e.code==='KeyM'){Snd.setMute(!Snd.muted);return;}
  const n=KEYMAP[e.code];if(n){e.preventDefault();if(!e.repeat){press(n);if(n==='up')press('kup');}}

/* スマホのタッチ操作 */
(function(){
  const body=document.body;
  const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0||/[?&]touch/.test(location.search);
  if(isTouch)body.classList.add('touch');
  addEventListener('pointerdown',e=>{if(e.pointerType==='touch')body.classList.add('touch');},{passive:true});
  const dp=document.getElementById('dpad'),ar={u:dp.querySelector('.tu'),d:dp.querySelector('.td'),l:dp.querySelector('.tl'),r:dp.querySelector('.tr')};
  const bA=document.getElementById('btnA'),bB=document.getElementById('btnB');
  /* 十字キー・A・Bの状態を「いま画面に触れている指」から毎回まとめて計算する。
     指が少しずれても押しっぱなしが途切れず、ボタン間を指でスライドもできる。 */
  let cur={left:false,right:false,up:false,down:false,a:false,b:false};
  function apply(n){
    for(const k in n){if(n[k]&&!cur[k])press(k);else if(!n[k]&&cur[k])release(k);}
    cur=n;
    ar.l.classList.toggle('on',n.left);ar.r.classList.toggle('on',n.right);ar.u.classList.toggle('on',n.up);ar.d.classList.toggle('on',n.down);
    bA.classList.toggle('on',n.a);bB.classList.toggle('on',n.b);
  }
  function inRect(el,x,y,pad){const r=el.getBoundingClientRect();return r.width>0&&x>=r.left-pad&&x<=r.right+pad&&y>=r.top-pad&&y<=r.bottom+pad;}
  function btnAt(x,y,pad){
    let best=null,bd=1e9;
    for(const[el,n]of[[bA,'a'],[bB,'b']]){if(!inRect(el,x,y,pad))continue;
      const r=el.getBoundingClientRect(),d=Math.hypot(x-(r.left+r.width/2),y-(r.top+r.height/2));if(d<bd){bd=d;best=n;}}
    return best;
  }
  function dirOf(x,y,n){
    const r=dp.getBoundingClientRect(),dx=(x-(r.left+r.width/2))/r.width,dy=(y-(r.top+r.height/2))/r.height,t=.13;
    if(dx<-t)n.left=true;if(dx>t)n.right=true;if(dy<-t)n.up=true;if(dy>t)n.down=true;
  }
  /* --- タッチ（スマホ）：ブラウザの拡大・長押し・スクロールを止めてゲームだけが受け取る --- */
  const owner=new Map(); // 指のID → 'dpad' | 'btn'
  function recompute(list){
    const n={left:false,right:false,up:false,down:false,a:false,b:false};
    for(const t of list){const k=owner.get(t.identifier);
      if(k==='dpad')dirOf(t.clientX,t.clientY,n);
      else if(k==='btn'){const b=btnAt(t.clientX,t.clientY,36);if(b)n[b]=true;}}
    apply(n);
  }
  const onSys=t=>t.target&&t.target.closest&&t.target.closest('.sys');
  document.addEventListener('touchstart',e=>{
    body.classList.add('touch');Snd.resume();
    for(const t of e.changedTouches){if(onSys(t))continue;
      if(inRect(dp,t.clientX,t.clientY,34))owner.set(t.identifier,'dpad');
      else if(btnAt(t.clientX,t.clientY,24))owner.set(t.identifier,'btn');}
    recompute(e.touches);e.preventDefault();
  },{passive:false});
  document.addEventListener('touchmove',e=>{recompute(e.touches);e.preventDefault();},{passive:false});
  const tEnd=e=>{
    for(const t of e.changedTouches)owner.delete(t.identifier);
    for(const id of[...owner.keys()])if(![...e.touches].some(t=>t.identifier===id))owner.delete(id);
    recompute(e.touches);Snd.resume();
    if(e.cancelable)e.preventDefault();
  };
  document.addEventListener('touchend',tEnd,{passive:false});
  document.addEventListener('touchcancel',tEnd,{passive:false});
  ['gesturestart','gesturechange','gestureend','dblclick'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
  const releaseAll=()=>{owner.clear();apply({left:false,right:false,up:false,down:false,a:false,b:false});};
  addEventListener('blur',releaseAll);document.addEventListener('visibilitychange',releaseAll);
  /* --- マウス（PCで ?touch 表示にしたとき用） --- */
  let mouse=null;
  const mouseList=()=>mouse?[{identifier:'m',clientX:mouse.x,clientY:mouse.y}]:[];
  addEventListener('mousedown',e=>{
    if(inRect(dp,e.clientX,e.clientY,0))owner.set('m','dpad');else if(btnAt(e.clientX,e.clientY,0))owner.set('m','btn');else return;
    mouse={x:e.clientX,y:e.clientY};recompute(mouseList());Snd.resume();
  });
  addEventListener('mousemove',e=>{if(mouse){mouse={x:e.clientX,y:e.clientY};recompute(mouseList());}});
  addEventListener('mouseup',()=>{if(mouse){mouse=null;owner.delete('m');recompute([]);}});
  /* --- 右上のボタン --- */
  const bp=document.getElementById('btnPause'),bm=document.getElementById('btnMute'),bf=document.getElementById('btnFull');
  bp.addEventListener('pointerup',e=>{e.preventDefault();Snd.resume();inp.p.pause=true;});
  bm.addEventListener('pointerup',e=>{e.preventDefault();Snd.resume();Snd.setMute(!Snd.muted);});
  if(document.documentElement.requestFullscreen&&document.fullscreenEnabled)bf.classList.add('can');
  bf.addEventListener('pointerup',e=>{e.preventDefault();
    if(document.fullscreenElement)document.exitFullscreen();
    else document.documentElement.requestFullscreen().then(()=>{try{screen.orientation.lock('landscape');}catch(_){}}).catch(()=>{});});
  document.addEventListener('contextmenu',e=>e.preventDefault());
  try{if(localStorage.getItem('belugaMute')==='1')Snd.setMute(true);}catch(e){}
})();

/* =====================================================================
   レベル生成（ステージごとに固定の乱数で毎回同じマップ）
   ===================================================================== */
function genLevel(si){
  const S=STAGES[si],rnd=mulberry32(9000+si*131),R=(a,b)=>a+Math.floor(rnd()*(b-a+1)),d=si/6;
  const target=125+si*12,grid=new Uint8Array(LW*ROWS);
  const enemies=[],coins=[],items=[],qc={},checks=[],plats=[],springs=[],hazards=[];
  const set=(c,r,t)=>{if(c>=0&&c<LW&&r>=0&&r<ROWS)grid[r*LW+c]=t;};
  const ground=(c0,c1)=>{for(let c=c0;c<c1;c++)for(let r=GROUND;r<ROWS;r++)set(c,r,1);};
  const walker=c=>enemies.push({type:'walk',x:c*TS+2,y:GROUND*TS-22,w:26,h:22,vx:0,vy:0,dir:-1,alive:true,dying:0,t:rnd()*9,skin:S.walker});
  const bird=(c,y)=>enemies.push({type:'fly',x:c*TS,y,baseY:y,w:28,h:20,vx:0,vy:0,dir:-1,alive:true,dying:0,t:rnd()*9,skin:si});
  const urchin=c=>enemies.push({type:'urchin',x:c*TS+2,y:GROUND*TS-24,w:26,h:24,vx:0,vy:0,dir:1,alive:true,dying:0,t:rnd()*9});
  const roo=c=>enemies.push({type:'hop',x:c*TS+3,y:GROUND*TS-30,w:24,h:30,vx:0,vy:0,dir:-1,alive:true,dying:0,t:rnd()*9,timer:.5+rnd()});
  const coin=(x,y)=>coins.push({x,y,got:false,t:rnd()*6});
  const coinRow=(c,n,row)=>{for(let i=0;i<n;i++)coin(c*TS+i*TS+TS/2,row*TS+TS/2);};
  const coinArc=(c,n,base)=>{for(let i=0;i<n;i++)coin((c+i)*TS+TS/2,base*TS-Math.sin(i/Math.max(1,n-1)*Math.PI)*46+TS/2);};
  let squid=null,star=false,oneup=false;

  ground(0,12);let c=12,mid=false,n=0;
  // 仕掛けを「山札」から順に引く：どのステージにも一通り出る
  const kinds=['flat','blocks','gap','stairs','blocks','pillar','float','gap',...S.gim];
  if(si>=1)kinds.push('urchin');if(si>=2)kinds.push('fly');if(si>=3)kinds.push('urchin','blocks');if(si>=5)kinds.push('gap','fly');
  let deck=[];
  const draw=()=>{if(!deck.length){deck=kinds.slice();for(let i=deck.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}}return deck.pop();};
  while(c<target){
    if(!mid&&c>target/2){ground(c,c+8);checks.push(c+3);c+=8;mid=true;continue;}
    const k=n===0?'blocks':n===1?S.gim[0]:draw();n++;   // 最初はイカのブロック、つぎにそのステージの仕掛け
    if(k==='flat'){
      const w=R(7,10);ground(c,c+w);
      for(let i=0,m=R(1,1+(d>.4?1:0));i<m;i++)walker(c+R(2,w-3));
      if(rnd()<.6)coinRow(c+2,R(3,5),GROUND-2);
      c+=w;
    }else if(k==='gap'){
      const gw=R(2,3);ground(c,c+3);ground(c+3+gw,c+3+gw+4);
      coinArc(c+2,gw+2,GROUND-2);
      if(rnd()<.4+d*.4)walker(c+3+gw+2);
      c+=3+gw+4;
    }else if(k==='stairs'){
      const h=R(2,3),hs=[];for(let i=1;i<=h;i++)hs.push(i);hs.push(h);for(let i=h-1;i>=1;i--)hs.push(i);
      ground(c,c+hs.length*2+3);
      hs.forEach((hh,i)=>{for(let j=0;j<hh;j++){set(c+1+i*2,GROUND-1-j,5);set(c+2+i*2,GROUND-1-j,5);}});
      coin((c+h*2)*TS+15,(GROUND-h-2)*TS+15);coin((c+1+h*2)*TS+15,(GROUND-h-2)*TS+15);
      if(d>.3)walker(c+hs.length*2+1);
      c+=hs.length*2+3;
    }else if(k==='pillar'){
      ground(c,c+14);
      const h1=R(2,3),h2=R(2,3);
      for(let j=0;j<h1;j++){set(c+3,GROUND-1-j,5);set(c+4,GROUND-1-j,5);}
      for(let j=0;j<h2;j++){set(c+10,GROUND-1-j,5);set(c+11,GROUND-1-j,5);}
      walker(c+6);if(d>.3&&rnd()<.6)walker(c+8);
      coin((c+3)*TS+TS,(GROUND-h1-2)*TS+15);coin((c+10)*TS+TS,(GROUND-h2-2)*TS+15);
      c+=14;
    }else if(k==='blocks'){
      const w=R(9,12);ground(c,c+w);const L=R(3,5),s=c+2,qs=[];
      for(let i=0;i<L;i++){if((i%2===1)||rnd()<.3){set(s+i,6,3);qs.push(s+i);}else set(s+i,6,2);}
      if(!qs.length){set(s+1,6,3);qs.push(s+1);}
      qs.forEach(col=>qc[6*LW+col]='coin');
      if(!squid){const col=qs[Math.floor(qs.length/2)];qc[6*LW+col]='squid';squid={idx:6*LW+col,col};}
      else{const col=qs[qs.length-1];
        if(!star&&c>target*.5&&rnd()<.6){qc[6*LW+col]='star';star=true;}
        else if(!oneup&&c>target*.25&&rnd()<.35){qc[6*LW+col]='oneup';oneup=true;}}
      coinRow(s,L,4);
      if(n>1&&rnd()<.7)walker(c+R(w-4,w-2));
      if(d>.5&&rnd()<.5)walker(c+w-6);
      c+=w;
    }else if(k==='float'){
      ground(c,c+2);
      const rows=[7,6,7];let px=c+4;
      rows.forEach(r=>{for(let j=0;j<3;j++)set(px+j,r,2);coinRow(px,3,r-2);px+=3+2;});
      const end=px-2;
      if(d>.3&&rnd()<.7)bird(c+9,R(120,170));
      ground(end,end+5);
      c=end+5;
    }else if(k==='fly'){
      const w=R(9,12);ground(c,c+w);
      for(let i=0,m=R(2,3);i<m;i++)bird(c+R(3,w+4),R(110,200));
      coinRow(c+3,4,GROUND-4);
      c+=w;
    }else if(k==='urchin'){
      const w=13;ground(c,c+w);
      urchin(c+4);urchin(c+10);coinArc(c+3,4,GROUND-2);coinArc(c+9,4,GROUND-2);
      if(d>.5)walker(c+7);
      c+=w;
    /* ---- ここからステージごとの仕掛け ---- */
    }else if(k==='train'){ // 東京：左右に動く新幹線
      const gw=R(7,9),pw=84,x0=(c+3)*TS;ground(c,c+3);
      plats.push({type:'moveX',skin:'train',x:x0,y:GROUND*TS-24,w:pw,h:16,x0,y0:GROUND*TS-24,range:gw*TS-pw,sp:.75+d*.5,ph:0,t:0,dx:0,dy:0});
      coinRow(c+4,gw-2,GROUND-4);
      ground(c+3+gw,c+3+gw+5);if(n>2)walker(c+3+gw+3);
      c+=3+gw+5;
    }else if(k==='sand'){ // エジプト：流砂
      const sw=R(4,6);ground(c,c+3);
      for(let i=0;i<sw;i++){set(c+3+i,GROUND,6);set(c+3+i,GROUND+1,6);set(c+3+i,GROUND+2,1);}
      coinArc(c+3,sw,GROUND-2);
      ground(c+3+sw,c+3+sw+5);if(n>2&&rnd()<.7)walker(c+3+sw+3);
      c+=3+sw+5;
    }else if(k==='balloon'){ // パリ：上下する気球
      const gw=R(9,11);ground(c,c+3);
      for(let i=0;i<2;i++){const bx=(c+3)*TS+(i+1)*gw*TS/3-28;
        plats.push({type:'moveY',skin:'balloon',x:bx,y:195,w:56,h:12,x0:bx,y0:195,range:55,sp:1.25+d*.3,ph:i*Math.PI,t:0,dx:0,dy:0});}
      coinRow(c+4,gw-2,3);
      ground(c+3+gw,c+3+gw+5);if(d>.3)bird(c+3+gw+2,R(120,160));
      c+=3+gw+5;
    }else if(k==='taxi'){ // ニューヨーク：走ってくるタクシー
      const w=18;ground(c,c+w);
      for(const tc of[c+1,c+10])hazards.push({type:'taxi',st:'wait',trig:tc*TS,x:0,y:0,w:54,h:26,vx:0,vy:0,tm:0});
      for(let i=0;i<4;i++)set(c+6+i,6,i===1?3:2);qc[6*LW+c+7]='coin';
      coinRow(c+6,4,4);
      c+=w;
    }else if(k==='girder'){ // ニューヨーク：乗ると落ちる鉄骨
      const gw=R(7,9);ground(c,c+3);
      for(let i=0;i<2;i++){const gx=(c+3)*TS+(i+1)*gw*TS/3-30,gy=GROUND*TS-36-i*22;
        plats.push({type:'fall',skin:'girder',x:gx,y:gy,w:60,h:12,x0:gx,y0:gy,st:'idle',tm:0,vy:0,t:0,dx:0,dy:0});}
      coinRow(c+4,gw-2,GROUND-5);
      ground(c+3+gw,c+3+gw+5);
      c+=3+gw+5;
    }else if(k==='spring'){ // リオ：ジャンプ台で高いかべをこえる
      const w=14,hh=5;ground(c,c+w);
      springs.push({x:(c+3)*TS+2,y:GROUND*TS-16,w:26,h:16,sq:0});
      for(let j=0;j<hh;j++){set(c+6,GROUND-1-j,5);set(c+7,GROUND-1-j,5);}
      for(let j=0;j<4;j++)coin((c+3)*TS+15,(GROUND-3-j)*TS+15);
      coinRow(c+6,2,GROUND-hh-2);
      walker(c+11);
      c+=w;
    }else if(k==='raft'){ // シドニー：乗るとしずむイカダ
      const gw=R(8,10);ground(c,c+3);
      for(let i=0;i<2;i++){const rx=(c+3)*TS+(i+1)*gw*TS/3-33;
        plats.push({type:'sink',skin:'raft',x:rx,y:GROUND*TS-8,w:66,h:10,x0:rx,y0:GROUND*TS-8,t:0,dx:0,dy:0});}
      coinArc(c+3,gw,GROUND-2);
      ground(c+3+gw,c+3+gw+5);if(d>.4)bird(c+3+gw,R(130,170));
      c+=3+gw+5;
    }else if(k==='roo'){ // シドニー：はねるカンガルー
      const w=R(10,12);ground(c,c+w);roo(c+5);roo(c+w-2);coinRow(c+3,4,GROUND-4);
      c+=w;
    }else if(k==='icicle'){ // 南極：氷のひさしから落ちるつらら
      const w=15;ground(c,c+w);
      for(let i=c+1;i<c+w-1;i++)set(i,2,5);
      for(let i=0;i<4;i++){const ix=(c+3+i*3)*TS+7;hazards.push({type:'icicle',st:'hang',x:ix,y:3*TS,w:16,h:30,vy:0,tm:0,y0:3*TS});}
      walker(c+8);coinRow(c+4,6,GROUND-2);
      c+=w;
    }
  }
  /* --- ボスアリーナ --- */
  ground(c,c+8);checks.push(c+2);c+=8;
  const arenaLeft=c;const cols=c+24;ground(c,cols);
  for(let r=0;r<GROUND;r++)set(cols-1,r,5);
  return {grid,cols,enemies,coins,items,qc,checks,arenaLeft,plats,springs,hazards,squid};
}

function respawn(){
  const p=G.p,cp=G.cp;
  Object.assign(p,{x:cp.col*TS,y:GROUND*TS-27,vx:0,vy:0,inv:2,star:0,dead:false,deadT:0,power:false,plat:null,sand:false,jumpBuf:0});
  G.time=TIME0;G.tick=0;G.hintB=false;
  G.cam.x=clamp(p.x-W*.4,0,G.cols*TS-W);
  G.locked=false;
  // ボス戦の壁を取り除き、ボスを元にもどす
  for(let r=0;r<GROUND;r++)for(let c=G.L.arenaLeft-4;c<G.L.arenaLeft+30;c++)if(c<G.cols-1&&G.grid[r*LW+c]===9)G.grid[r*LW+c]=0;
  const hp=G.boss.hp;G.boss=newBoss(G.L,G.S);G.boss.hp=hp;
  G.bubbles.length=0;G.shots.length=0;
  // イカのブロックは、チェックポイントより先にあるときだけ復活
  const sq=G.L.squid;if(sq&&sq.col>=cp.col&&G.grid[sq.idx]===4){G.grid[sq.idx]=3;G.items=G.items.filter(i=>i.type!=='squid');}
  for(const hz of G.hazards){
    if(hz.type==='taxi')hz.st=hz.trig>p.x?'wait':'done';
    else if(hz.type==='icicle'&&hz.x>p.x+80){hz.st='hang';hz.y=hz.y0;hz.vy=0;}
  }
  for(const q of G.plats){if(q.type==='fall'){q.st='idle';q.y=q.y0;q.vy=0;}if(q.type==='sink')q.y=q.y0;}
}

/* =====================================================================
   物理
   ===================================================================== */
const GRAV=1900,SPEED=185,JUMP=650,MAXF=760;
// 6=流砂（すり抜ける）
function solid(c,r){if(c<0||c>=G.cols)return true;if(r<0||r>=ROWS)return false;const t=G.grid[r*LW+c];return t>0&&t!==6;}
function tileAt(x,y){const c=Math.floor(x/TS),r=Math.floor(y/TS);if(c<0||c>=G.cols||r<0||r>=ROWS)return 0;return G.grid[r*LW+c];}
function moveEntity(e,dt){
  e.hitWall=false;
  e.x+=e.vx*dt;
  const dx=Math.sign(e.vx);
  if(dx!==0){
    const r0=Math.floor(e.y/TS),r1=Math.floor((e.y+e.h-.01)/TS),c0=Math.floor(e.x/TS),c1=Math.floor((e.x+e.w-.01)/TS);
    for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++)if(solid(c,r)){
      if(dx>0)e.x=Math.min(e.x,c*TS-e.w);else e.x=Math.max(e.x,(c+1)*TS);e.vx=0;e.hitWall=true;}
  }
  e.y+=e.vy*dt;e.onGround=false;e.bump=null;
  const dy=Math.sign(e.vy);
  if(dy!==0){
    const r0=Math.floor(e.y/TS),r1=Math.floor((e.y+e.h-.01)/TS),c0=Math.floor(e.x/TS),c1=Math.floor((e.x+e.w-.01)/TS);
    let best=null,bd=1e9;
    for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++)if(solid(c,r)){
      if(dy>0){e.y=Math.min(e.y,r*TS-e.h);e.onGround=true;}
      else{e.y=Math.max(e.y,(r+1)*TS);const dd=Math.abs(c*TS+TS/2-(e.x+e.w/2));if(dd<bd){bd=dd;best={c,r};}}
      e.vy=0;
    }
    e.bump=best;
  }
}
const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const hitCircle=(r,s,k=.85)=>{const nx=clamp(s.x,r.x,r.x+r.w),ny=clamp(s.y,r.y,r.y+r.h);return Math.hypot(s.x-nx,s.y-ny)<s.r*k;};

Object.assign(SFX,{
  spring(){Snd.tone(220,.22,'square',.1,880);},
  horn(){Snd.tone(392,.14,'square',.09);Snd.tone(392,.2,'square',.09,null,.18);},
  crack(){Snd.noise(.12,.12);Snd.tone(1400,.08,'triangle',.06,700);},
  kick(){Snd.tone(180,.08,'square',.12,90);Snd.noise(.05,.1);},
  toss(){Snd.tone(600,.1,'triangle',.08,300);},
  hurry(){[880,988,880,988].forEach((f,i)=>Snd.tone(f,.08,'square',.07,null,i*.1));},
  squid(){[523,784,1047,1319,1568].forEach((f,i)=>Snd.tone(f,.1,'sine',.12,null,i*.06));},
  none(){Snd.tone(160,.08,'triangle',.08);}
});

function spawnParts(x,y,n,colors,spd=120,life=.6){
  for(let i=0;i<n;i++){const a=Math.random()*TAU,s=spd*(.4+Math.random()*.8);
    G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-40,life,max:life,c:colors[i%colors.length],r:2+Math.random()*2.5});}
}
function addScore(n,x,y){run.score+=n;if(x!==undefined)G.pops.push({x,y,t:.8,s:'+'+n});}
function getFish(x,y){
  run.fish++;addScore(10);SFX.coin();
  if(run.fish%100===0){run.lives++;SFX.up();G.pops.push({x,y,t:1.2,s:'1UP!'});}
}

function hitBlock(c,r){
  const i=r*LW+c,t=G.grid[i];
  G.bumps.push({c,r,t:0});SFX.bump();
  if(t===3){
    G.grid[i]=4;const ct=G.qc[i]||'coin',x=c*TS+TS/2,y=r*TS;
    if(ct==='coin'){getFish(x,y);spawnParts(x,y-6,6,['#ffd23f','#fff'],110,.5);G.items.push({type:'popcoin',x,y:y-10,t:0});}
    else{G.items.push({type:ct,x:x-11,y:y+2,by:y,w:22,h:22,t:0,rise:24,got:false,sp:ct==='star'?95:70,vx:0,vy:0});if(ct!=='coin')SFX.power();}
  }
}

// 初期マリオと同じく、どんな攻撃でも1回で1機へる
function hurtPlayer(){
  const p=G.p;if(p.inv>0||p.star>0||p.dead||G.mode==='won')return;
  killPlayer();
}
function killPlayer(){
  const p=G.p;if(p.dead)return;
  p.dead=true;p.deadT=0;p.vy=-560;p.vx=0;p.power=false;p.plat=null;Music.stop();SFX.die();
}

function shoot(){
  const p=G.p;if(p.bubbleCd>0||G.bubbles.length>=2)return;
  p.bubbleCd=.32;SFX.bubble();
  G.bubbles.push({x:p.x+p.w/2+p.face*14,y:p.y+9,vx:p.face*250+p.vx*.25,vy:-45,t:0,r:8});
}

/* =====================================================================
   更新：足場
   ===================================================================== */
function updatePlats(dt){
  for(const q of G.plats){
    const ox=q.x,oy=q.y;q.t+=dt;
    if(q.type==='moveX')q.x=q.x0+q.range*(.5-.5*Math.cos(q.t*q.sp+q.ph));
    else if(q.type==='moveY')q.y=q.y0+Math.sin(q.t*q.sp+q.ph)*q.range;
    else if(q.type==='fall'){
      if(q.st==='idle'){if(q.occ){q.st='shake';q.tm=.45;SFX.crack();}}
      else if(q.st==='shake'){q.tm-=dt;if(q.tm<=0){q.st='fall';q.vy=0;}}
      else if(q.st==='fall'){q.vy+=1300*dt;q.y+=q.vy*dt;if(q.y>H+60){q.st='gone';q.tm=2.5;}}
      else if(q.st==='gone'){q.tm-=dt;if(q.tm<=0){q.st='idle';q.y=q.y0;q.vy=0;}}
    }else if(q.type==='sink'){
      if(q.occ)q.y=Math.min(q.y+40*dt,H+80);else q.y=Math.max(q.y0,q.y-60*dt);
    }
    q.dx=q.x-ox;q.dy=q.y-oy;q.occ=false;
  }
  for(const s of G.springs)if(s.sq>0)s.sq-=dt;
}

/* =====================================================================
   更新：プレイ
   ===================================================================== */
function updatePlay(dt){
  if(inp.p.pause){setState('pause');setMenu([{label:'つづける',fn:()=>{setState('play');}},{label:'タイトルへ',fn:()=>{Music.stop();toTitle();}}]);return;}
  const p=G.p,S=G.S;G.t+=dt;p.t+=dt;
  if(shake>0)shake=Math.max(0,shake-dt);
  const jumpH=inp.h.a||inp.h.kup,jumpP=inp.p.a||inp.p.kup;
  updatePlats(dt);
  /* --- タイム --- */
  if(!p.dead&&G.mode!=='won'){
    G.tick+=dt;
    while(G.tick>=TICK){G.tick-=TICK;G.time--;if(G.time===100)SFX.hurry();if(G.time<=0){G.time=0;killPlayer();break;}}
  }
  /* --- プレイヤー --- */
  if(p.dead){
    p.deadT+=dt;p.vy=Math.min(p.vy+GRAV*dt,MAXF);p.y+=p.vy*dt;
    if(p.deadT>1.7){
      run.lives--;
      if(run.lives<=0){setState('gameover');setMenu([{label:'もういちど',fn:()=>{run.lives=3;run.score=0;startIntro();}},{label:'タイトルへ',fn:()=>toTitle()}]);Music.stop();}
      else respawn();
    }
  }else{
    const frozen=G.mode==='won';
    const dir=frozen?0:((inp.h.right?1:0)-(inp.h.left?1:0));
    const ice=S.ice&&p.onGround&&!p.plat;
    const maxV=p.sand?60:SPEED;
    const acc=p.onGround?(ice?480:1700):1100,dec=p.onGround?(ice?150:1500):350;
    p.vx=approach(p.vx,dir*maxV,(dir!==0?acc:dec)*dt);
    if(dir)p.face=dir;
    if(!frozen&&jumpP)p.jumpBuf=.12;else p.jumpBuf-=dt;
    p.coyote=p.onGround?.1:p.coyote-dt;
    if(p.jumpBuf>0&&p.coyote>0){p.vy=-(p.sand?480:JUMP);p.jumpBuf=0;p.coyote=0;p.onGround=false;p.plat=null;SFX.jump();}
    const g=(p.vy<0&&!jumpH)?GRAV*2.3:GRAV;
    p.vy=Math.min(p.vy+g*dt,MAXF);
    p.bubbleCd-=dt;
    if(!frozen&&inp.p.b){
      if(p.power)shoot();
      else{SFX.none();if(!G.hintB){G.hintB=true;G.pops.push({x:p.x+12,y:p.y-14,t:1.8,s:'イカを食べると あわが出せる！'});}}
    }
    if(p.inv>0)p.inv-=dt;if(p.star>0)p.star-=dt;
    if(G.mode==='won'&&G.wonT>1.6&&p.onGround&&Math.floor(G.wonT*1.6)!==Math.floor((G.wonT-dt)*1.6)){p.vy=-420;}
    // 乗っている足場といっしょに動く
    if(p.plat){p.x+=p.plat.dx;p.y+=p.plat.dy;}
    const prevB=p.y+p.h;
    moveEntity(p,dt);
    if(p.bump){const t=G.grid[p.bump.r*LW+p.bump.c];if(t===2||t===3)hitBlock(p.bump.c,p.bump.r);}
    p.plat=null;
    if(p.vy>=0)for(const q of G.plats){
      if(q.st==='gone')continue;
      if(p.x+p.w>q.x+3&&p.x<q.x+q.w-3&&prevB<=q.y+2+Math.max(0,q.dy)&&p.y+p.h>=q.y){p.y=q.y-p.h;p.vy=0;p.onGround=true;p.plat=q;q.occ=true;break;}
    }
    for(const s of G.springs){
      if(p.vy>=0&&ov(p,s)&&p.y+p.h<=s.y+s.h+1){p.y=s.y-p.h;p.vy=-(jumpH?1000:880);p.onGround=false;p.coyote=0;s.sq=.25;SFX.spring();}
    }
    // 流砂：ゆっくりしずむ。頭までしずんだらアウト
    p.sand=tileAt(p.x+p.w/2,p.y+p.h-3)===6;
    if(p.sand){
      if(p.vy>22)p.vy=22;p.onGround=true;
      if(Math.random()<.15)spawnParts(p.x+p.w/2,GROUND*TS,1,['#d9a85a'],40,.4);
      if(p.y>GROUND*TS+2)killPlayer();
    }
    p.walk+=Math.abs(p.vx)*dt*.09;
    p.x=Math.max(p.x,G.cam.x);
    if(p.y>H+40)killPlayer();
  }
  /* --- カメラ --- */
  const maxCam=G.cols*TS-W;
  if(!G.locked){
    const tx=clamp(p.x+p.w/2-W*.4,0,maxCam);
    if(tx>G.cam.x)G.cam.x+=(tx-G.cam.x)*Math.min(1,dt*9);
    const wc=Math.floor(maxCam/TS);
    if(!p.dead&&p.x>(wc+1)*TS+6&&G.boss.hp>0){
      G.locked=true;
      for(let r=0;r<GROUND;r++)G.grid[r*LW+wc]=9;
      G.boss.state='idle';G.boss.timer=1.2;
      G.pops.push({x:maxCam+W/2,y:120,t:2.4,s:S.boss.hint});
    }
  }else G.cam.x+=(maxCam-G.cam.x)*Math.min(1,dt*5);
  /* --- チェックポイント --- */
  G.checks.forEach(k=>{if(!k.active&&p.x>k.x&&!p.dead){k.active=true;G.cp.col=Math.floor(k.x/TS);SFX.power();spawnParts(k.x+8,GROUND*TS-40,10,['#ffd23f','#fff','#ff9ec4'],130,.8);}});
  /* --- 敵 --- */
  const spd=1+stageIdx*.07;
  for(const e of G.enemies){
    if(!e.alive){e.dying+=dt;if(e.type!=='none'){e.vy+=GRAV*.6*dt;e.y+=e.vy*dt;e.x+=e.vx*dt;}continue;}
    if(e.x>G.cam.x+W+90||e.x+e.w<G.cam.x-140)continue;
    e.t+=dt;
    if(e.type==='walk'){
      e.vx=e.dir*42*spd;e.vy=Math.min(e.vy+GRAV*dt,MAXF);
      moveEntity(e,dt);
      if(e.hitWall)e.dir*=-1;
      else if(e.onGround){const fx=e.dir>0?e.x+e.w+3:e.x-3;if(!solid(Math.floor(fx/TS),Math.floor((e.y+e.h+3)/TS)))e.dir*=-1;}
      if(e.y>H+60){e.alive=false;e.type='none';}
    }else if(e.type==='fly'){
      e.x+=e.dir*38*spd*dt;e.y=e.baseY+Math.sin(e.t*2.2)*32;
    }else if(e.type==='hop'){ // カンガルー：プレイヤーに向かってはねる
      e.vy=Math.min(e.vy+GRAV*dt,MAXF);moveEntity(e,dt);
      if(e.onGround){e.vx=0;e.timer-=dt;if(e.timer<=0){e.dir=(p.x<e.x)?-1:1;e.vy=-540;e.vx=e.dir*120;e.timer=.9+Math.random()*.5;}}
      if(e.y>H+60){e.alive=false;e.type='none';}
    }
  }
  /* --- あわ --- */
  for(const b of G.bubbles){
    b.t+=dt;b.vy+=90*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.vx*=.995;
    if(b.t>1.3||solid(Math.floor(b.x/TS),Math.floor(b.y/TS))){b.dead=true;spawnParts(b.x,b.y,5,['#dff6ff','#fff'],60,.35);SFX.pop();continue;}
    const bb={x:b.x-b.r,y:b.y-b.r,w:b.r*2,h:b.r*2};
    for(const e of G.enemies)if(e.alive&&e.type!=='none'&&ov(bb,e)){
      if(e.type==='urchin'){b.dead=true;spawnParts(b.x,b.y,5,['#dff6ff'],60,.35);SFX.pop();}
      else{killEnemy(e,b.vx>0?1:-1);b.dead=true;}
      break;
    }
    if(!b.dead)for(const s of G.shots)if(!s.dead&&s.type!=='wave'&&s.type!=='icefall'&&Math.hypot(s.x-b.x,s.y-b.y)<s.r+b.r){s.dead=b.dead=true;spawnParts(s.x,s.y,8,['#dff6ff','#fff'],90,.4);SFX.pop();addScore(50,s.x,s.y);break;}
    const bo=G.boss;
    if(!b.dead&&bo.hp>0&&['wait','dying','sink','under'].indexOf(bo.state)<0&&ov(bb,bo)){b.dead=true;spawnParts(b.x,b.y,6,['#dff6ff','#fff'],70,.4);SFX.pop();}
  }
  G.bubbles=G.bubbles.filter(b=>!b.dead);
  /* --- 敵との当たり判定 --- */
  if(!p.dead)for(const e of G.enemies){
    if(!e.alive||e.type==='none'||!ov(p,e))continue;
    if(p.star>0){killEnemy(e,p.face);continue;}
    if(e.type!=='urchin'&&p.vy>0&&(p.y+p.h)-e.y<18){
      killEnemy(e,0,true);p.vy=-(jumpH?520:360);p.onGround=false;
    }else hurtPlayer();
  }
  /* --- 魚コイン・アイテム --- */
  for(const c of G.coins){if(c.got)continue;c.t+=dt;
    if(!p.dead&&Math.abs(c.x-(p.x+p.w/2))<18&&Math.abs(c.y-(p.y+p.h/2))<20){c.got=true;getFish(c.x,c.y);spawnParts(c.x,c.y,4,['#ffd23f','#fff'],80,.4);}}
  for(const it of G.items){
    if(it.type==='popcoin'){it.t+=dt;continue;}
    if(it.got)continue;it.t+=dt;
    if(it.rise>0){const d=Math.min(it.rise,60*dt);it.y-=d;it.rise-=d;continue;}
    // 出てきたアイテムは歩いて（はねて）にげる
    it.vx=it.sp;it.vy=Math.min(it.vy+GRAV*.8*dt,MAXF);moveEntity(it,dt);
    if(it.hitWall)it.sp=-it.sp;
    if(it.type==='star'&&it.onGround)it.vy=-440;
    if(it.y>H+40){it.got=true;continue;}
    if(!p.dead&&ov(p,it)){it.got=true;const x=it.x+11,y=it.y+10;
      if(it.type==='squid'){p.power=true;SFX.squid();addScore(1000,it.x,it.y);G.pops.push({x,y:y-24,t:1.6,s:'あわパワー！ Bであわを とばせる'});spawnParts(x,y,14,['#ff8fc4','#fff','#b98cff'],150,.8);}
      else if(it.type==='oneup'){run.lives++;SFX.up();G.pops.push({x,y,t:1.2,s:'1UP!'});spawnParts(x,y,10,['#7be07b','#fff'],120,.7);}
      else{p.star=9;addScore(1000,it.x,it.y);SFX.power();spawnParts(x,y,14,['#ffe14a','#fff','#7ad7ff'],150,.8);}
    }
  }
  G.items=G.items.filter(i=>!(i.type==='popcoin'&&i.t>.35));
  G.bumps.forEach(b=>b.t+=dt);G.bumps=G.bumps.filter(b=>b.t<.2);
  /* --- 仕掛け（タクシー・つらら） --- */
  for(const hz of G.hazards){
    if(hz.type==='taxi'){
      if(hz.st==='wait'){if(!p.dead&&p.x>hz.trig){hz.st='warn';hz.tm=.9;SFX.horn();}}
      else if(hz.st==='warn'){hz.tm-=dt;if(hz.tm<=0){hz.st='drive';hz.x=G.cam.x+W+10;hz.y=GROUND*TS-hz.h;hz.vy=0;}}
      else if(hz.st==='drive'){
        hz.vx=-(260+stageIdx*6);hz.vy=Math.min(hz.vy+GRAV*dt,MAXF);moveEntity(hz,dt);
        if(hz.hitWall){hz.st='done';spawnParts(hz.x,hz.y+10,10,['#ffd23f','#333','#fff'],140,.6);SFX.boom();}
        else if(hz.x+hz.w<G.cam.x-80||hz.y>H+60)hz.st='done';
        else if(!p.dead&&ov(p,hz)){if(p.vy>0&&p.y+p.h-hz.y<16){p.vy=-(jumpH?600:440);SFX.stomp();}else hurtPlayer();}
      }
    }else if(hz.type==='icicle'){
      if(hz.st==='hang'){if(!p.dead&&p.x+p.w/2>hz.x-70){hz.st='shake';hz.tm=.35;SFX.crack();}}
      else if(hz.st==='shake'){hz.tm-=dt;if(hz.tm<=0){hz.st='fall';hz.vy=0;}}
      else if(hz.st==='fall'){hz.vy+=1500*dt;hz.y+=hz.vy*dt;if(hz.y+hz.h>=GROUND*TS){hz.st='done';spawnParts(hz.x+8,GROUND*TS-4,10,['#dff6ff','#fff','#9fd6f2'],130,.5);SFX.pop();}}
      if(hz.st==='fall'&&!p.dead&&ov(p,{x:hz.x+3,y:hz.y,w:hz.w-6,h:hz.h}))hurtPlayer();
    }
  }
  /* --- ボスと、ボスの攻撃 --- */
  updateBoss(dt);
  updateShots(dt);
  /* --- BGM：スター中 → ボス戦 → ステージの曲 --- */
  if(state==='play'&&!p.dead&&G.mode!=='won')Music.play(p.star>0?9:(G.locked&&G.boss.hp>0?8:stageIdx+1));
  /* --- ステージクリア進行 --- */
  if(G.mode==='won'){
    G.wonT+=dt;
    G.cageOpen=clamp((G.wonT-.4)/1.0,0,1);
    if(G.wonT>1.6){const tx=G.p.x+G.p.w/2+(G.p.face>0?-44:44);G.friend.hop=Math.abs(Math.sin(G.wonT*5))*10;G.friend.x+=(clamp(tx,G.cam.x+40,G.cols*TS-90)-G.friend.x)*Math.min(1,dt*2.2);}
    if(G.wonT>1.6&&Math.floor(G.wonT*6)!==Math.floor((G.wonT-dt)*6))G.parts.push({x:G.friend.x+Math.random()*30-8,y:GROUND*TS-40,vx:Math.random()*30-15,vy:-60-Math.random()*50,life:1.1,max:1.1,c:'heart',r:6});
    if(G.wonT>4.2)finishStage();
  }
  /* --- パーティクル --- */
  for(const q of G.parts){q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=(q.c==='heart'?-20:260)*dt;}
  G.parts=G.parts.filter(q=>q.life>0);
  for(const q of G.pops){q.t-=dt;q.y-=(q.s.length>6?8:30)*dt;}G.pops=G.pops.filter(q=>q.t>0);
}
function killEnemy(e,dir,stomp){
  e.alive=false;e.dying=0;
  if(stomp){e.squash=true;e.vy=0;e.vx=0;SFX.stomp();addScore(100,e.x,e.y);spawnParts(e.x+e.w/2,e.y+e.h,6,['#fff','#ffe08a'],90,.4);}
  else{e.vy=-260;e.vx=dir*90;SFX.pop();addScore(100,e.x,e.y);spawnParts(e.x+e.w/2,e.y+e.h/2,6,['#dff6ff','#fff'],90,.4);}
}

/* =====================================================================
   ボス：ステージごとに行動パターンがちがう
   hop=はねる / charge=とっしん / pound=大ジャンプで地ひびき / throw=放物線でなげる
   jet=水鉄砲（上下）/ soccer=はねるボール / boomer=ブーメラン / dive=もぐって下から / icicle=つららの雨
   ===================================================================== */
function arenaL(){return (Math.floor((G.cols*TS-W)/TS)+1)*TS;}
function bossStart(b,name,dirTo,sp){
  b.act=name;b.dir=dirTo;
  if(name==='hop'){b.state='air';b.vy=-430;b.vx=dirTo*110*sp;}
  else if(name==='charge'){b.state='tele';b.timer=.7;b.vx=0;SFX.tele();}
  else if(name==='pound'){b.state='pound';const air=2*760/(GRAV*.8);b.vy=-760;b.vx=clamp((G.p.x+G.p.w/2-(b.x+b.w/2))/air,-280,280);SFX.jump();}
  else if(name==='dive'){b.state='sink';b.timer=.5;b.vx=0;SFX.bubble();}
  else{b.state='cast';b.timer=.55;b.vx=0;b.n={throw:3,jet:4,soccer:2,boomer:2,icicle:1}[name]||1;}
}
function bossFire(b){
  const p=G.p,cx=b.x+b.w/2,pc=p.x+p.w/2,dirTo=pc<cx?-1:1,a=b.act,k=b.n;b.dir=dirTo;
  if(a==='throw'){
    const tx=pc+(k-2)*45,Tt=.95,g=1100,y0=b.y+6,dy=GROUND*TS-10-y0;
    G.shots.push({type:'ball',x:cx+dirTo*20,y:y0,vx:(tx-cx)/Tt,vy:(dy-.5*g*Tt*Tt)/Tt,g,r:10,t:0,rot:0});SFX.toss();
  }else if(a==='jet'){
    const low=k%2===0;
    G.shots.push({type:'jet',x:cx+dirTo*34,y:low?GROUND*TS-11:GROUND*TS-52,vx:dirTo*300,r:9,t:0});SFX.bubble();
  }else if(a==='soccer'){
    G.shots.push({type:'soccer',x:cx+dirTo*30,y:b.y+8,vx:dirTo*(170+k*45),vy:-380,r:11,t:0,rot:0});SFX.kick();
  }else if(a==='boomer'){
    const high=k%2===1;
    G.shots.push({type:'boomer',x:cx+dirTo*30,y:high?GROUND*TS-50:GROUND*TS-13,vx:dirTo*430,ax:-dirTo*310,r:11,t:0,rot:0});SFX.toss();
  }else if(a==='icicle'){
    const L=arenaL()+20,Rr=(G.cols-1)*TS-20,xs=[pc];
    for(let i=0;i<4;i++)xs.push(L+(i+Math.random())*(Rr-L)/4);
    xs.forEach((x,i)=>G.shots.push({type:'icefall',st:'warn',tm:.75+i*.18,x,y:-30,vy:0,r:10,t:0}));
    SFX.crack();shake=.3;
  }
}
function updateBoss(dt){
  const b=G.boss,p=G.p;
  if(b.state==='wait'||b.state==='gone')return;
  b.t+=dt;if(b.hurt>0)b.hurt-=dt;
  const sp=1+stageIdx*.07,cx=b.x+b.w/2,dirTo=(p.x+p.w/2)<cx?-1:1,pat=G.S.boss.pat;
  if(b.state==='dying'){b.vy+=GRAV*.7*dt;b.y+=b.vy*dt;b.x+=b.vx*dt;b.rot+=dt*7;if(b.y>H+120)b.state='gone';return;}
  const limitR=(G.cols-1)*TS;
  if(b.state==='sink'){b.timer-=dt;b.sink=clamp(1-b.timer/.5,0,1);if(b.timer<=0){b.state='under';b.timer=1.1;b.tx=p.x+p.w/2;}return;}
  if(b.state==='under'){
    b.timer-=dt;if(b.timer>.4)b.tx+=(p.x+p.w/2-b.tx)*Math.min(1,dt*6);
    if(b.timer<=0){b.state='air';b.act='dive';b.sink=0;b.x=clamp(b.tx-b.w/2,arenaL(),limitR-b.w);b.y=GROUND*TS-b.h;b.vy=-820;b.vx=0;shake=.3;SFX.boom();
      spawnParts(b.tx,GROUND*TS,16,['#dff6ff','#fff','#9fd6f2'],170,.7);}
    return;
  }
  b.vy=Math.min(b.vy+GRAV*.8*dt,MAXF);
  if(b.state==='idle'){if(b.onGround){b.vx*=.75;b.timer-=dt;if(b.timer<=0)bossStart(b,pat[b.step++%pat.length],dirTo,sp);}}
  else if(b.state==='tele'){b.timer-=dt;b.vx=0;if(b.timer<=0){b.state='charge';}}
  else if(b.state==='charge'){b.vx=b.dir*260*sp;}
  else if(b.state==='stun'){b.timer-=dt;b.vx=0;if(b.timer<=0){b.state='idle';b.timer=.4;}}
  else if(b.state==='cast'){b.vx*=.8;b.timer-=dt;if(b.timer<=0){bossFire(b);b.n--;if(b.n>0)b.timer=b.act==='jet'?.6:.5;else{b.state='idle';b.timer=.7;}}}
  const wasAir=!b.onGround;
  moveEntity(b,dt);
  if(b.x+b.w>limitR){b.x=limitR-b.w;if(b.vx>0)b.vx=0;b.hitWall=true;}
  if(b.state==='charge'&&b.hitWall){b.state='stun';b.timer=1.5;b.vx=0;shake=.35;SFX.boom();spawnParts(b.x+b.w/2,b.y,10,['#fff','#ffe14a'],130,.7);}
  if(wasAir&&b.onGround){
    if(b.state==='pound'){shake=.4;SFX.boom();b.state='idle';b.timer=.7;
      for(const d of[-1,1])G.shots.push({type:'wave',x:b.x+b.w/2+d*30,y:GROUND*TS-12,vx:d*220*sp,r:12,t:0});}
    else if(b.state==='air'){b.state='idle';b.timer=b.act==='hop'?.25:.6;shake=Math.max(shake,.08);}
  }
  /* --- プレイヤーとの接触 --- */
  if(p.dead||G.mode==='won'||b.hurt>0)return;
  if(!ov(p,{x:b.x+4,y:b.y+4,w:b.w-8,h:b.h-4}))return;
  const stomp=p.vy>0&&(p.y+p.h)-b.y<24;
  if(stomp||p.star>0){
    b.hp--;b.hurt=1.2;SFX.stomp();SFX.boom();shake=.25;
    spawnParts(b.x+b.w/2,b.y+6,14,['#fff','#ffe14a','#7ad7ff'],150,.7);
    if(stomp){p.vy=-560;p.onGround=false;}
    if(b.hp<=0){b.state='dying';b.vy=-460;b.vx=dirTo*70;b.rot=0;addScore(3000,b.x,b.y-10);G.shots.length=0;G.mode='won';G.wonT=0;Music.stop();SFX.clear();}
    else if(b.state!=='air'&&b.state!=='pound'){b.state='idle';b.timer=.9;b.vx=0;}
  }else if(b.state!=='stun')hurtPlayer();
}
function updateShots(dt){
  const p=G.p,L=arenaL(),Rr=(G.cols-1)*TS;
  for(const s of G.shots){
    s.t+=dt;
    if(s.type==='wave'){s.x+=s.vx*dt;if(s.x<L||s.x>Rr)s.dead=true;}
    else if(s.type==='ball'){s.vy+=s.g*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.rot+=dt*10;
      if(s.y+s.r>GROUND*TS){s.dead=true;spawnParts(s.x,GROUND*TS-4,8,G.S.id==='antarctica'?['#fff','#dff6ff']:['#dff6ff','#7ad7ff','#fff'],110,.45);SFX.pop();}}
    else if(s.type==='jet'){s.x+=s.vx*dt;if(Math.random()<.4)G.parts.push({x:s.x-Math.sign(s.vx)*10,y:s.y+(Math.random()-.5)*8,vx:0,vy:0,life:.25,max:.25,c:'#bfe9ff',r:2.5});}
    else if(s.type==='soccer'){s.vy+=900*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.rot+=s.vx*dt*.08;
      if(s.y+s.r>GROUND*TS){s.y=GROUND*TS-s.r;s.vy=-Math.max(420,Math.abs(s.vy)*.86);}
      if(s.x-s.r<L){s.x=L+s.r;s.vx=Math.abs(s.vx);}if(s.x+s.r>Rr){s.x=Rr-s.r;s.vx=-Math.abs(s.vx);}
      if(s.t>7){s.dead=true;spawnParts(s.x,s.y,6,['#fff','#222'],90,.4);}}
    else if(s.type==='boomer'){s.vx+=s.ax*dt;s.x+=s.vx*dt;s.rot+=dt*18;if(s.t>3.4)s.dead=true;}
    else if(s.type==='icefall'){
      if(s.st==='warn'){s.tm-=dt;if(s.tm<=0){s.st='fall';s.y=-20;s.vy=0;}}
      else{s.vy+=1500*dt;s.y+=s.vy*dt;if(s.y+14>GROUND*TS){s.dead=true;spawnParts(s.x,GROUND*TS-4,10,['#dff6ff','#fff','#9fd6f2'],130,.5);SFX.pop();}}
    }
    if(s.type!=='soccer'&&s.type!=='icefall'&&(s.x<L-20||s.x>Rr+20))s.dead=true;
    if(s.dead||p.dead||G.mode==='won'||s.st==='warn')continue;
    const box=s.type==='icefall'?{x:s.x-7,y:s.y-16,w:14,h:30}:null;
    if(box?ov(p,box):hitCircle(p,s)){
      if(s.type==='soccer'&&p.vy>0&&p.y+p.h<s.y){s.dead=true;p.vy=-(inp.h.a?560:420);SFX.stomp();addScore(200,s.x,s.y);spawnParts(s.x,s.y,8,['#fff','#222'],110,.5);}
      else hurtPlayer();
    }
  }
  G.shots=G.shots.filter(s=>!s.dead);
}
function finishStage(){
  G.bonus=G.time*5;run.score+=G.bonus;
  save.cleared=Math.max(save.cleared,stageIdx+1);writeSave();
  setState('clear');
}

function drawTiles(){
  const th=G.S.tile,c0=Math.max(0,Math.floor(G.cam.x/TS)),c1=Math.min(G.cols-1,c0+Math.ceil(W/TS)+1);
  for(let r=0;r<ROWS;r++)for(let c=c0;c<=c1;c++){
    const t=G.grid[r*LW+c];if(!t)continue;
    let x=c*TS,y=r*TS;
    const bp=G.bumps.find(b=>b.c===c&&b.r===r);if(bp)y-=Math.sin(bp.t/.2*Math.PI)*8;
    if(t===1){
      const top=!G.grid[(r-1)*LW+c]&&r>0;
      rect(x,y,TS,TS,th.body);
      ctx.fillStyle=th.dark;const h=hash(c*7+r*3);ctx.fillRect(x+4+h*14,y+8+hash(c+r)*14,5,3);ctx.fillRect(x+18-h*6,y+16,4,3);
      if(top){rect(x,y,TS,8,th.top);
        if(G.S.id==='tokyo'||G.S.id==='rio'){ctx.fillStyle='#4fb23a';for(let i=0;i<4;i++)ctx.fillRect(x+3+i*7,y+8,4,3);}
        else{ctx.fillStyle='rgba(0,0,0,.08)';ctx.fillRect(x,y+7,TS,2);}}
      if(G.S.id==='paris'||G.S.id==='nyc'){ctx.strokeStyle='rgba(0,0,0,.18)';ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,TS-1,TS-1);}
    }else if(t===2){
      rect(x,y,TS,TS,th.brick);ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=1.5;ctx.strokeRect(x+.75,y+.75,TS-1.5,TS-1.5);
      ctx.beginPath();ctx.moveTo(x,y+TS/2);ctx.lineTo(x+TS,y+TS/2);ctx.moveTo(x+TS/2,y);ctx.lineTo(x+TS/2,y+TS/2);ctx.moveTo(x+TS/4,y+TS/2);ctx.lineTo(x+TS/4,y+TS);ctx.moveTo(x+TS*.75,y+TS/2);ctx.lineTo(x+TS*.75,y+TS);ctx.stroke();
      rect(x+1,y+1,TS-2,3,'rgba(255,255,255,.3)');
    }else if(t===3){
      const g=.5+.5*Math.sin(G.t*5);rect(x,y,TS,TS,'#ffc93a');rect(x+2,y+2,TS-4,TS-4,'#ffdd6a');
      ctx.strokeStyle='#b7801a';ctx.lineWidth=2;ctx.strokeRect(x+1,y+1,TS-2,TS-2);
      for(const[px,py]of[[4,4],[TS-6,4],[4,TS-6],[TS-6,TS-6]])ell(x+px+1,y+py+1,1.3,1.3,'#b7801a');
      txt('?',x+TS/2,y+TS/2+1,20,g>.5?'#fff':'#fff6c0','center','#b7801a',3);
    }else if(t===4){
      rect(x,y,TS,TS,'#9a8f80');rect(x+2,y+2,TS-4,TS-4,'#b3a898');ctx.strokeStyle='#6f665b';ctx.lineWidth=2;ctx.strokeRect(x+1,y+1,TS-2,TS-2);
    }else if(t===5||t===9){
      rect(x,y,TS,TS,th.hard);rect(x,y,TS,4,'rgba(255,255,255,.4)');rect(x,y+TS-4,TS,4,'rgba(0,0,0,.2)');rect(x+TS-4,y,4,TS,'rgba(0,0,0,.15)');
      ctx.strokeStyle='rgba(0,0,0,.3)';ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,TS-1,TS-1);
    }else if(t===6){ // 流砂
      rect(x,y,TS,TS,r===GROUND?'#d4a257':'#b98640');
      if(r===GROUND){const w=Math.sin(G.t*3+c)*2;rect(x,y,TS,5,'#e6bd72');
        ctx.strokeStyle='rgba(120,70,20,.45)';ctx.lineWidth=1.5;
        for(let i=0;i<2;i++){ctx.beginPath();ctx.ellipse(x+TS/2,y+12+i*8,9+w-i*3,2.5,0,0,TAU);ctx.stroke();}}
    }
  }
  // 海のあるステージは、穴の下に水をえがく
  if(G.S.id==='sydney'||G.S.id==='rio'||G.S.id==='antarctica'){
    const col=G.S.id==='antarctica'?'rgba(40,90,170,.9)':'rgba(30,140,210,.9)';
    for(let c=c0;c<=c1;c++){if(G.grid[(ROWS-1)*LW+c])continue;
      const x=c*TS,y=GROUND*TS+22+Math.sin(G.t*2.5+c*.8)*3;rect(x,y,TS+1,H-y,col);rect(x,y,TS+1,3,'rgba(255,255,255,.55)');}
  }
}
function drawPlats(){
  for(const q of G.plats){
    if(q.st==='gone'||q.x>G.cam.x+W+80||q.x+q.w<G.cam.x-80)continue;
    const x=q.x+(q.st==='shake'?Math.sin(G.t*60)*1.5:0),y=q.y;
    if(q.skin==='train'){ // 新幹線
      rrect(x,y,q.w,q.h+6,8);ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle='#9aa7b8';ctx.lineWidth=1.5;ctx.stroke();
      poly([x+q.w-10,y,x+q.w+12,y+q.h+6,x+q.w-10,y+q.h+6],'#fff');
      rect(x+2,y+q.h-2,q.w+2,3,'#1f5fbf');
      for(let i=0;i<5;i++)rrect(x+8+i*14,y+4,9,6,2),ctx.fillStyle='#4a6a90',ctx.fill();
      ell(x+14,y+q.h+7,4,4,'#555');ell(x+q.w-14,y+q.h+7,4,4,'#555');
    }else if(q.skin==='balloon'){ // 気球：てっぺんに乗る
      const cx=x+q.w/2;
      ctx.strokeStyle='#6b4a2a';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(cx-12,y+46);ctx.lineTo(cx-7,y+58);ctx.moveTo(cx+12,y+46);ctx.lineTo(cx+7,y+58);ctx.stroke();
      ell(cx,y+26,30,28,'#ff5a7a');ell(cx,y+26,12,28,'#ffd23f');ell(cx-10,y+14,6,9,'rgba(255,255,255,.35)');
      rect(cx-8,y+58,16,10,'#8a5a2a');rect(x+4,y-1,q.w-8,4,'rgba(255,255,255,.5)');
    }else if(q.skin==='girder'){ // 鉄骨
      rect(x,y,q.w,q.h,'#c8453a');rect(x,y,q.w,3,'#e0705f');rect(x,y+q.h-3,q.w,3,'#8e2c24');
      for(let i=0;i<4;i++)ell(x+8+i*15,y+q.h/2,2.5,2.5,'#6e1f19');
    }else if(q.skin==='raft'){ // イカダ
      for(let i=0;i<5;i++){rrect(x+i*13.2,y,12.5,q.h,4);ctx.fillStyle=i%2?'#b07a45':'#c48a50';ctx.fill();}
      rect(x+4,y+3,q.w-8,2,'#7a4f28');
    }
  }
  for(const s of G.springs){ // ジャンプ台
    if(s.x>G.cam.x+W+40||s.x<G.cam.x-60)continue;
    const k=s.sq>0?.45:1,top=s.y+s.h*(1-k);
    ctx.strokeStyle='#666';ctx.lineWidth=3;ctx.beginPath();
    for(let i=0;i<=4;i++){const yy=top+6+(s.y+s.h-top-6)*i/4;ctx.lineTo(s.x+(i%2?4:s.w-4),yy);}ctx.stroke();
    rrect(s.x,top,s.w,7,3);ctx.fillStyle='#ff4a5a';ctx.fill();rect(s.x-2,s.y+s.h-3,s.w+4,3,'#555');
  }
}

function drawShots(){
  const id=G.S.id;
  for(const s of G.shots){
    ctx.save();ctx.translate(s.x,s.y);
    if(s.type==='wave'){const col=id==='egypt'?'#d9a85a':id==='antarctica'?'#dff6ff':'#6fc3ff';
      const h=16+Math.sin(s.t*20)*3;ctx.beginPath();ctx.moveTo(-15,12);ctx.quadraticCurveTo(-6,12-h*1.6,0,12-h*1.4);ctx.quadraticCurveTo(6,12-h*1.6,15,12);ctx.closePath();ctx.fillStyle=col;ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=2;ctx.stroke();}
    else if(s.type==='ball'){
      if(id==='paris'){ctx.rotate(s.rot);rrect(-15,-5,30,10,5);ctx.fillStyle='#d99a4a';ctx.fill();ctx.strokeStyle='#a4692a';ctx.lineWidth=1.5;for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(i*8-3,-3);ctx.lineTo(i*8+3,3);ctx.stroke();}}
      else if(id==='antarctica'){ell(0,0,s.r,s.r,'#fff');ell(-3,-3,3,3,'#dff6ff');}
      else{ell(0,0,s.r,s.r,'rgba(110,200,255,.9)');ell(-3,-3,3,2,'#fff');}}
    else if(s.type==='jet'){ctx.scale(Math.sign(s.vx),1);ell(-6,0,16,s.r*.8,'rgba(120,205,255,.85)');ell(4,0,8,s.r*.9,'#dff6ff');ell(6,-2,3,2,'#fff');}
    else if(s.type==='soccer'){ctx.rotate(s.rot);ell(0,0,s.r,s.r,'#fff');ctx.strokeStyle='#333';ctx.lineWidth=1.2;ctx.stroke();
      for(let i=0;i<5;i++){const a=i/5*TAU;ell(Math.cos(a)*7,Math.sin(a)*7,2.6,2.6,'#222');}ell(0,0,3.3,3.3,'#222');}
    else if(s.type==='boomer'){ctx.rotate(s.rot);ctx.strokeStyle='#a0622e';ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-12,6);ctx.lineTo(0,-6);ctx.lineTo(12,6);ctx.stroke();ctx.lineCap='butt';}
    else if(s.type==='icefall'){
      if(s.st==='warn'){ctx.restore();ctx.globalAlpha=.35+.3*Math.sin(G.t*20);ell(s.x,GROUND*TS-2,14,4,'#1d3a70');ctx.globalAlpha=1;continue;}
      poly([-8,-16,8,-16,0,16],'#bfe8fb');poly([0,-16,8,-16,0,16],'#8fcbe8');}
    ctx.restore();
  }
}
function drawBeluga(fx,fy,face,t,o={}){
  const s=o.s||1;ctx.save();ctx.translate(fx,fy);ctx.scale(face*s,s);

  const g=ctx.createLinearGradient(0,-28,0,0);g.addColorStop(0,'#ffffff');g.addColorStop(1,'#cfe3f3');
  ctx.beginPath();ctx.ellipse(0,-14,20,14,0,0,TAU);ctx.fillStyle=g;ctx.fill();ctx.stroke();
  ell(10,-24.5,7.5,3.6,'#fff');

  ell(14,-19,2.4,3,'#22354f');ell(14.9,-20,.95,.95,'#fff');
  ell(14.5,-11.5,3.6,2.3,'rgba(255,130,155,.6)');
  ctx.beginPath();ctx.arc(17.5,-13.5,2.6,.25,2.2);ctx.lineWidth=1.2;ctx.strokeStyle='#557391';ctx.stroke();
  ctx.save();ctx.translate(-2,-9);ctx.rotate(.55+(o.air?-.9:Math.sin(t*9)*.2));ell(0,4,4.2,8,'#bcd6ea');ctx.restore();

function drawSquidShape(t,s){ // イカ（頭に乗せるときも使う）
  ctx.save();ctx.scale(s,s);
  ctx.strokeStyle='#ff7ab6';ctx.lineWidth=2.4;ctx.lineCap='round';

  drawOcean(T);rect(0,0,W,H,'rgba(8,30,66,.35)');
  txt('ステージえらび',W/2,34,26,'#fff','center','#2c7ec4',6);
  hits=[];
  for(let i=0;i<7;i++){
    const row=i<4?0:1,cnt=row?3:4,ix=row?i-4:i,cw=140,ch=100,gap=12,x=W/2-(cnt*cw+(cnt-1)*gap)/2+ix*(cw+gap),y=68+row*(ch+16);
    const open=i<=save.cleared,sel=selStage===i,S=STAGES[i];
    rrect(x,y,cw,ch,14);const g=ctx.createLinearGradient(0,y,0,y+ch);g.addColorStop(0,S.sky[0]);g.addColorStop(1,S.sky[1]);
    ctx.fillStyle=open?g:'#5a6675';ctx.fill();ctx.lineWidth=sel?5:2.5;ctx.strokeStyle=sel?'#ffd23f':'#fff';ctx.stroke();
    if(open){txt(String(i+1),x+22,y+22,26,'#fff','center','rgba(20,50,100,.8)',5);
      txt(S.cont,x+cw/2+8,y+22,14,'#fff','center','rgba(20,50,100,.8)',4);
      txt(S.city,x+cw/2,y+56,12,'#fff','center','rgba(20,50,100,.8)',3.5);
      if(save.cleared>i)drawBeluga(x+cw/2,y+ch-6,1,T+i,{s:.5,bow:true});
      else txt('NEW!',x+cw/2,y+ch-16,14,'#ffe14a','center','#a04a00',3.5);}
    else{txt('🔒',x+cw/2,y+40,30,'#fff');txt('STAGE '+(i+1),x+cw/2,y+78,12,'#e3ebf5');}
    hits.push({x,y,w:cw,h:ch,idx:i,fn:()=>{if(open){selStage=i;newRun(i);}}});
  }
  hits.push({x:10,y:H-44,w:110,h:34,idx:99,fn:()=>toTitle()});
  rrect(10,H-44,110,34,17);ctx.fillStyle='rgba(255,255,255,.88)';ctx.fill();txt('もどる（B）',65,H-27,14,'#24507f');
}
function drawIntro(){
  const S=STAGES[stageIdx],g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,S.sky[0]);g.addColorStop(1,S.sky[1]);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const fake={S,cam:{x:T*30},t:T};const sv=G;G=fake;
  try{BG[S.id]();}catch(e){}G=sv;
  rect(0,0,W,H,'rgba(0,20,50,.35)');
  const k=Math.min(1,introT*3);ctx.globalAlpha=k;
  txt('STAGE '+(stageIdx+1),W/2,86,54,'#fff','center','#e4741a',10);
  txt(S.cont,W/2,140,26,'#ffe14a','center','#1b3a6a',6);
  txt(S.city,W/2,176,30,'#fff','center','#1b3a6a',7);
  txt(S.tag,W/2,212,15,'#fff','center','#1b3a6a',4);
  drawBeluga(W/2-30,300,1,T,{s:1.2,walk:true});drawBeluga(W/2+70,296,-1,T+1,{s:.9,bow:true,air:true});
  drawOrca({x:W/2+94,y:258,w:64,h:44,state:'idle',t:T,rot:0},0,0,-1);
  txt('！',W/2+72,244,20,'#ff3a3a','center','#fff',4);
  txt('のこり ×'+run.lives,W/2-100,300,15,'#fff','center','#1b3a6a',4);
  ctx.globalAlpha=.6+.4*Math.sin(T*5);txt('A / タップ でスタート',W/2,340,13,'#fff','center','#1b3a6a',3.5);ctx.globalAlpha=1;
}
function drawOverlayBox(title,color,sub){
  rect(0,0,W,H,'rgba(4,16,40,.62)');txt(title,W/2,90,46,color,'center','#12315e',9);if(sub)txt(sub,W/2,132,15,'#fff','center','#12315e',4);
}
function drawMenuList(y0){
  hits=[];menu.items.forEach((it,i)=>uiButton(it.label,W/2-115,y0+i*48,230,38,i,it.fn));
}
function drawClear(){
  drawWorld();drawHUD();drawOverlayBox('ステージクリア！','#ffe14a','ともだちを たすけだしたよ！');
  const S=STAGES[stageIdx];
  txt(S.cont+'　'+S.city,W/2,162,16,'#cfe8ff','center','#12315e',4);
  drawBeluga(W/2-24,262,1,T,{s:1.4,air:true});drawBeluga(W/2+40,258,-1,T+1,{s:1.2,bow:true,air:true});
  for(let i=0;i<8;i++){const a=T*1.5+i;heart(W/2+8+Math.cos(a)*110,255+Math.sin(a*1.3)*22,14,'#ff7aa8');}
  txt('タイムボーナス  '+G.bonus,W/2,196,15,'#fff','center','#12315e',4);
  txt('スコア  '+run.score,W/2,218,17,'#ffe98a','center','#12315e',4);
  if(stTimer>.9){ctx.globalAlpha=.6+.4*Math.sin(T*5);txt(stageIdx>=6?'A / タップ で つづきへ':'A / タップ で つぎのステージへ',W/2,332,15,'#fff','center','#12315e',4);ctx.globalAlpha=1;}
}
function drawGameOver(){
  drawWorld();drawHUD();drawOverlayBox('ゲームオーバー','#ff9a9a','あきらめないで！ もういちど ちょうせん');
  drawBeluga(W/2,250,1,T,{s:1.3});drawMenuList(276-70+0);
}
function drawPause(){
  drawWorld();drawHUD();drawOverlayBox('ポーズ','#fff');drawMenuList(150);
}
const ENDING_NAMES=['アジア','アフリカ','ヨーロッパ','北アメリカ','南アメリカ','オセアニア','南極'];
function drawEnding(){
  drawOcean(T);rect(0,0,W,H,'rgba(255,220,240,.15)');
  for(let i=0;i<40;i++){const x=(hash(i)*W+T*20*(hash(i+3)-.5))%W,y=(hash(i+9)*H+T*40*(.5+hash(i+5)))%H;heart(x,y,6+hash(i+1)*6,['#ff7aa8','#ffd23f','#7ad7ff','#b6f28a'][i%4]);}
  txt('ぜんぶの なかまを たすけたよ！',W/2,56,28,'#fff','center','#e4741a',7);
  txt('ありがとう、ベルーガ！',W/2,96,20,'#ffe14a','center','#12315e',5);
  for(let i=0;i<7;i++){const x=W/2+(i-3)*82,y=196+Math.abs(Math.sin(T*3+i*.7))*-18;
    drawBeluga(x,y,i%2?1:-1,T+i,{s:.85,bow:true,air:true});txt(ENDING_NAMES[i],x,212,10,'#fff','center','#12315e',3);}
  drawBeluga(W/2,290+Math.abs(Math.sin(T*3+2))*-20,1,T,{s:1.2,air:true});
  txt('おしまい',W/2,318,24,'#fff','center','#12315e',6);
  if(stTimer>2){ctx.globalAlpha=.6+.4*Math.sin(T*5);txt('A / タップ で タイトルへ',W/2,344,13,'#fff','center','#12315e',3.5);ctx.globalAlpha=1;}
}

/* =====================================================================
   メインループ
   ===================================================================== */
function confirm(){return inp.p.a;}
function updateMenuKeys(){
  if(inp.p.up||inp.p.left){menu.sel=(menu.sel+menu.items.length-1)%menu.items.length;SFX.select();}
  if(inp.p.down||inp.p.right){menu.sel=(menu.sel+1)%menu.items.length;SFX.select();}
  if(inp.p.a){SFX.ok();menu.items[menu.sel].fn();}
}
function update(dt){
  T+=dt;stTimer+=dt;
  if(state==='title')updateMenuKeys();
  else if(state==='select'){
    const n=7,mx=Math.min(6,save.cleared);
    if(inp.p.left)selStage=Math.max(0,selStage-1);if(inp.p.right)selStage=Math.min(mx,selStage+1);
    if(inp.p.up)selStage=Math.max(0,selStage-4);if(inp.p.down)selStage=Math.min(mx,selStage+4);
    if(inp.p.left||inp.p.right||inp.p.up||inp.p.down)SFX.select();
    if(inp.p.a){SFX.ok();newRun(selStage);}
    if(inp.p.b||inp.p.pause)toTitle();
  }
  else if(state==='intro'){introT+=dt;if(introT>.5&&(inp.p.a||introT>3.2)){startStage(stageIdx);}}
  else if(state==='play')updatePlay(dt);
  else if(state==='pause'){if(inp.p.pause){setState('play');}else updateMenuKeys();}
  else if(state==='clear'){if(stTimer>.9&&inp.p.a){SFX.ok();if(stageIdx>=6){setState('ending');Music.play(10);}else{stageIdx++;startIntro();}}}
  else if(state==='gameover')updateMenuKeys();
  else if(state==='ending'){if(stTimer>2&&inp.p.a)toTitle();}
  Music.update();
}
const btnBEl=document.getElementById('btnB');let btnBOff=null;
function render(){
  const off=state==='play'&&G&&!G.p.power;if(off!==btnBOff){btnBOff=off;btnBEl.classList.toggle('off',off);}
  ctx.setTransform(scale,0,0,scale,0,0);ctx.clearRect(0,0,W,H);
  if(state!=='title'&&state!=='select'&&state!=='pause'&&state!=='gameover')hits=[];
  switch(state){
    case 'title':drawTitle();break;
    case 'select':drawSelect();break;
    case 'intro':drawIntro();break;
    case 'play':drawWorld();drawHUD();break;
    case 'pause':drawPause();break;
    case 'clear':drawClear();break;
    case 'gameover':drawGameOver();break;
    case 'ending':drawEnding();break;
  }
}
/* 画面タップ（メニュー／進行） */
cv.addEventListener('pointerdown',e=>{
  Snd.resume();
  const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
  for(const b of hits)if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){if(b.idx!==99&&state!=='select')menu.sel=b.idx;SFX.ok();b.fn();return;}
  if(state==='intro'||state==='clear'||state==='ending')inp.p.a=true;
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')inp.p.pause=true;});
/* 縦向きのときは止める */
function portraitBlocked(){return document.body.classList.contains('touch')&&innerHeight>innerWidth;}

let last=performance.now(),acc=0;
function frame(now){
  requestAnimationFrame(frame);
  let d=(now-last)/1000;last=now;if(d>.25)d=.25;
  if(portraitBlocked()){if(state==='play')inp.p.pause=true;else return;}
  acc+=d;let n=0;
  while(acc>=1/60&&n<6){update(1/60);clearEdges();acc-=1/60;n++;}
  if(n===6)acc=0;
  render();
}
toTitle();
requestAnimationFrame(frame);
/* テスト・デバッグ用フック */
window.__beluga={inp,step(n){for(let i=0;i<n;i++){update(1/60);clearEdges();}render();},get G(){return G},get state(){return state},startStage,newRun,run,save,STAGES};
</script>
